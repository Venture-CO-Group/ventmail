; ventSSO production PHP settings.
expose_php = Off
; A kivétel stack-trace-ében a függvény-ARGUMENTUMOK (SQL-kötések, címek, fájlrészletek) ne
; szerepeljenek: a trace a naplóba és a failed_jobs-ba kerül.
zend.exception_ignore_args = On
memory_limit = 256M
; A kontakt-import feltöltési plafonja (AUDIENCE_IMPORT_MAX_MB, alap 100) + tartalék. A PHP-limit
; GLOBÁLIS — az útvonalankénti határ a Caddyben (`request_body @import/@other`) és az
; alkalmazásban (`LimitRequestBody`). A
; `post_max_size` > `upload_max_filesize` (a multipart-burkoló), a Caddy `request_body` pedig
; ezeknél nem szűkebb. Az `ImportConfigConsistencyTest` őrzi az összhangot.
upload_max_filesize = 128M
post_max_size = 132M
; A kérés csak tárol és olcsó őröket futtat (a felmérés háttérjob); a 120 mp a nagy feltöltés ideje.
max_execution_time = 120
date.timezone = UTC

; OPcache — production (timestamps not validated; deploy ships a fresh image).
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0

; Sessions are handled by Laravel (redis), not native PHP sessions.
session.cookie_httponly = 1
session.cookie_secure = 1
session.use_strict_mode = 1
