[www]
; Runs as the image's non-root user (10001); no user/group switch needed.
; A unix socket on a per-colour volume shared only with this colour's `web`:
; nothing on a Docker network (trust-db, ventsso-data) can speak FastCGI to it.
listen = /run/php/fpm.sock
listen.mode = 0600

; Pass container environment variables through to PHP (compose env_file).
clear_env = no

; Sized for the 1 GB container limit (~40 MB per worker under load).
pm = dynamic
pm.max_children = 16
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

; Container healthcheck (docker/healthcheck.sh).
ping.path = /fpm-ping
ping.response = pong

; Surface fatal errors / worker output to the container log.
catch_workers_output = yes
decorate_workers_output = no
