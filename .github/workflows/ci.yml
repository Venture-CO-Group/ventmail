name: CI

on:
  pull_request:
  push:
    branches: [main]
  # A release workflow ugyanezt a kaput hívja meg az image-építés előtt.
  workflow_call:

# A GITHUB_TOKEN a lehető legszűkebb jogot kapja (security-review B2).
permissions:
  contents: read

concurrency:
  # A workflow neve is a kulcs része: a main-re pusholt CI és a release által meghívott
  # kapu (ugyanazon a refen) különben kölcsönösen megszakítaná egymást.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (teszt · pint · composer audit)
    runs-on: ubuntu-latest

    services:
      db:
        # UGYANAZ az image, mint dev-ben — a hypertable-teszt valódi Timescale ellen fut.
        image: timescale/timescaledb-ha:pg17
        env:
          POSTGRES_DB: ventmail_test
          POSTGRES_USER: ventmail
          POSTGRES_PASSWORD: ventmail
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U ventmail -d ventmail_test"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=5s --health-retries=20

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: ventmail_test
      DB_USERNAME: ventmail
      DB_PASSWORD: ventmail
      DB_SSLMODE: disable
      REDIS_HOST: 127.0.0.1
      HAS_PACKAGES_TOKEN: ${{ secrets.VENTURE_PACKAGES_TOKEN != '' }}

    steps:
      # Minden action commit SHA-ra pinelve: mozgó tag mellett egy retagelt action
      # ugyanahhoz a futtatókörnyezethez (és tokenhez) férne hozzá.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, redis, intl, zip, bcmath, pcntl, gd
          coverage: none

      - name: composer install
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: env
        # Az AUDIT_PEPPER kötelező és fail-closed (a KeyedHash üres pepperrel dob) — a CI
        # eldobható értéket generál, ahogy egy friss telepítés is tenné.
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan ventmail:pepper | sed 's/^/AUDIT_PEPPER=/' >> .env

      # A drift-teszt a SZOMSZÉD repó forrásából olvas. Enélkül a mező-szintű
      # `@venture/sdk` ellenőrzés a CI-ban HANGOSAN kihagyódik (nem zöldül csendben).
      - name: venture-sdk (drift-ellenőrzéshez)
        # A `secrets` kontextus step-szintű `if`-ben NEM elérhető, ezért job-szinten
        # csak egy BOOLEAN kerül env-be — maga a token soha (a teszt-stepek nem látják).
        if: env.HAS_PACKAGES_TOKEN == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Venture-CO-Group/venture-sdk
          token: ${{ secrets.VENTURE_PACKAGES_TOKEN }}
          path: .ci/venture-sdk
          persist-credentials: false

      - name: pint (kód-stílus)
        run: ./vendor/bin/pint --test

      - name: php artisan test
        env:
          VENTURE_SDK_PATH: ${{ github.workspace }}/.ci/venture-sdk
        run: php artisan test --parallel

      # A socket-tesztek portot foglalnak: KÜLÖN, SOROS futás. Enélkül a 11. kritériumnak
      # nem lenne hálózati bizonyítéka — a napi futást viszont flaky-vá tennék.
      - name: php artisan test (socket)
        run: php artisan test --group=smtp-socket

      # A folytonos aggregátum tesztjei tesztenként újraépítik a sémát (a
      # `refresh_continuous_aggregate` nem mehet tranzakción belül). A materializált nézet
      # eldobása párhuzamosan katalógus-versenyt okoz — soros futásban viszont stabil.
      - name: php artisan test (timescale)
        run: php artisan test --group=timescale

      # A 300 000 soros kontakt-import teszt (streamelt feldolgozás, memória-plafon): percekig
      # fut, ezért KÜLÖN, soros lépésben — de a CI-ban mindig lefut (v1.1 · 6. közönség-import).
      - name: php artisan test (heavy)
        run: php artisan test --group=heavy

      - name: composer audit
        run: composer audit --no-interaction

      # A deploy-scriptek (deploy.sh, init-env.sh, set-env.sh) stub-docker elleni tesztje
      # és a shell-scriptek statikus ellenőrzése.
      - name: deploy tesztek + shellcheck
        run: |
          bash deploy/tests/deploy_test.sh
          shellcheck deploy/*.sh deploy/tests/*.sh docker/*.sh

  frontend:
    name: Frontend (vue-tsc · build · npm audit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Beszédes hiba, ha a secret hiányzik: enélkül a checkout csak annyit mond,
      # hogy „Input required and not supplied: token".
      - name: 'előfeltétel ellenőrzése'
        env:
          PACKAGES_TOKEN: ${{ secrets.VENTURE_PACKAGES_TOKEN }}
        run: |
          if [ -z "${PACKAGES_TOKEN}" ]; then
            echo "::error::Hiányzik a VENTURE_PACKAGES_TOKEN repo secret. A frontend kapu a privát @venture/design|ui|sdk csomagokat klónozza; enélkül nem futtatható. Settings → Secrets and variables → Actions."
            exit 1
          fi

      # A @venture/* csomagok `file:../venture-*` linkkel jönnek. Az actions/checkout csak a
      # workspace-en BELÜLRE tud klónozni, ezért _packages/ alá megy, és onnan symlinkeljük a
      # testvér-elrendezésbe. persist-credentials: false — különben a token a .git/config-ba
      # kerülne, ahonnan egy PR-ből érkező npm lifecycle-script kiolvashatná (security-review B2).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Venture-CO-Group/venture-sdk
          path: _packages/venture-sdk
          token: ${{ secrets.VENTURE_PACKAGES_TOKEN }}
          persist-credentials: false

      - name: 'testvér-elrendezés (a file: linkek feloldása)'
        run: |
          for pkg in venture-sdk; do
            ln -sfn "${GITHUB_WORKSPACE}/_packages/${pkg}" "$(dirname "${GITHUB_WORKSPACE}")/${pkg}"
          done

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      # A @venture-co-group/design és /ui (Unified UI v2, 2.x) a GitHub Packages regiszteréből
      # jön (lásd lent, `npm ci`). Csak a @venture/sdk marad FORRÁSKÓDBAN (`file:` link a
      # testvér-könyvtárra), nem
      # publikált tarballként — a `dist/` tehát NINCS bennük. A csomag `prepare` scriptje
      # építene, de a saját devDependencyjei (tsup, vite) csak akkor vannak meg, ha a
      # csomagban MAGÁBAN is lefutott az install. Enélkül a ventMail `npm ci`-je
      # `tsup: not found` (127) hibával áll meg — mérve, az első futáson, amikor a
      # `VENTURE_PACKAGES_TOKEN` végre megvolt.
      - name: '@venture/sdk telepítése és építése'
        env:
          PACKAGES_TOKEN: ${{ secrets.VENTURE_PACKAGES_TOKEN }}
        run: |
          # Egy esetleges `git+ssh` függőség miatt: a runneren nincs SSH-kulcs (`Permission
          # denied (publickey)`, exit 128 — mérve). A rewrite ezért kell.
          #
          # A token KIZÁRÓLAG ennek a lépésnek a környezetében él (`GIT_CONFIG_*`), NEM a
          # globális `~/.gitconfig`-ban: a workflow végig `persist-credentials: false`-szal
          # dolgozik, épp azért, hogy egy PR-ből érkező npm lifecycle-script ne tudja
          # kiolvasni a tokent (security-review B2). Egy globális gitconfig ezt a rést
          # nyitná ki újra — a step-szintű env csak a @venture/sdk saját scriptjeinek
          # látszik, a ventMail `npm ci`-jének már nem.
          export GIT_CONFIG_COUNT=2
          export GIT_CONFIG_KEY_0="url.https://x-access-token:${PACKAGES_TOKEN}@github.com/.insteadOf"
          export GIT_CONFIG_VALUE_0="ssh://git@github.com/"
          export GIT_CONFIG_KEY_1="url.https://x-access-token:${PACKAGES_TOKEN}@github.com/.insteadOf"
          export GIT_CONFIG_VALUE_1="git@github.com:"

          for pkg in venture-sdk; do
            dir="${GITHUB_WORKSPACE}/_packages/${pkg}"
            [ -f "${dir}/package.json" ] || continue
            npm --prefix "${dir}" ci --no-audit --no-fund
            npm --prefix "${dir}" run build --if-present
          done

      # npm ci: a committolt package-lock.json kényszerül, a CI nem csúszhat el a lokálistól.
      #
      # A @venture-co-group/* a GitHub Packagesből: a scope → regiszter leképezést és a
      # `${NODE_AUTH_TOKEN}`-t olvasó `.npmrc`-t a lépés maga írja (a repóban a `.npmrc`
      # szándékosan gitignore-olt). KÉT LÉPÉSBEN, hogy a token ne lássék a lifecycle-scripteknek
      # (security-review B2): a letöltés `--ignore-scripts`-szel megy a job csak olvasó
      # GITHUB_TOKEN-jével (a csomagok „Manage Actions access" beállításában a ventmail repónak
      # Read jog kell), a scriptek (`npm rebuild`) már token nélkül futnak.
      - name: npm ci (letöltés, scriptek nélkül)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s\n' '@venture-co-group:registry=https://npm.pkg.github.com' \
            '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}' > .npmrc
          npm ci --no-audit --no-fund --ignore-scripts
          rm .npmrc

      - name: npm rebuild (lifecycle-scriptek, token nélkül)
        run: npm rebuild

      - name: vue-tsc (típusellenőrzés)
        run: npm run typecheck

      # Frontend unit tesztek (v1.1 · 13. pont): a sablonszerkesztő és a journey-vászon
      # állapotkezelése (Vitest + happy-dom, `tests/js/`).
      - name: vitest (frontend unit tesztek)
        run: npm run test:unit

      - name: vite build
        run: npm run build

      # A release image PONTOSAN ezt a buildet kapja (Dockerfile: public/build kötelező).
      - name: public/build artefaktum
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public-build
          path: public/build
          retention-days: 7
          if-no-files-found: error

      - name: npm audit
        run: npm audit --audit-level=high

  e2e:
    name: E2E (Playwright · napló-flow)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    # A 29. kritérium Playwrightot ír elő a napló-flow-ra. Egy teszt, amit a CI sosem futtat,
    # nem kapu: az első elrontott képernyő csendben átmenne rajta.
    services:
      db:
        image: timescale/timescaledb-ha:pg17
        env:
          POSTGRES_DB: ventmail_test
          POSTGRES_USER: ventmail
          POSTGRES_PASSWORD: ventmail
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U ventmail -d ventmail_test"
          --health-interval=5s --health-timeout=5s --health-retries=20

    env:
      APP_ENV: local
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: ventmail_test
      DB_USERNAME: ventmail
      DB_PASSWORD: ventmail
      DB_SSLMODE: disable
      # A dev-belépés és a demó-adat KÉT független kapcsolón múlik; itt mindkettő adott, és
      # a környezet `local` — élesben a route nem is regisztrálódik.
      IDENTITY_DEV_LOGIN: "true"
      SENDING_DRIVER: fake
      # A BÖNGÉSZŐ-TESZT SEM KÉRDEZHET VALÓDI DNS-T — ugyanaz a szabály, mint a Pest-nél
      # (`phpunit.xml`: „a teszt SOHA nem kérdezhet valódi DNS-t").
      #
      # Enélkül a demó-levél a PreSendGate 6. kapuján akadt fenn: a `demo@example.test`
      # domainjének nincs MX-rekordja, tehát az ÉLES resolver mellett a kockázati pontszám
      # jogosan magas — `rejected / VALIDATION_RISK` (mérve, a CI első Playwright-futásán).
      # A kapu tehát HELYESEN működött; a teszt-környezet volt rossz: egy böngésző-teszt
      # eredménye nem függhet attól, mit válaszol épp a világ DNS-e.
      DOMAINS_RESOLVER: fake

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 'előfeltétel ellenőrzése'
        env:
          PACKAGES_TOKEN: ${{ secrets.VENTURE_PACKAGES_TOKEN }}
        run: |
          if [ -z "${PACKAGES_TOKEN}" ]; then
            echo "::error::Hiányzik a VENTURE_PACKAGES_TOKEN repo secret. Az e2e kapu a privát @venture/design|ui csomagokat klónozza; enélkül nem futtatható."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Venture-CO-Group/venture-sdk
          path: _packages/venture-sdk
          token: ${{ secrets.VENTURE_PACKAGES_TOKEN }}
          persist-credentials: false

      - name: 'testvér-elrendezés (a file: linkek feloldása)'
        run: |
          for pkg in venture-sdk; do
            ln -sfn "${GITHUB_WORKSPACE}/_packages/${pkg}" "$(dirname "${GITHUB_WORKSPACE}")/${pkg}"
          done

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          extensions: pgsql, pdo_pgsql, redis, intl, bcmath, sodium
          coverage: none

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: composer install
        run: composer install --no-interaction --prefer-dist --no-progress

      # A @venture-co-group/design és /ui (Unified UI v2, 2.x) a GitHub Packages regiszteréből
      # jön (lásd lent, `npm ci`). Csak a @venture/sdk marad FORRÁSKÓDBAN (`file:` link a
      # testvér-könyvtárra), nem
      # publikált tarballként — a `dist/` tehát NINCS bennük. A csomag `prepare` scriptje
      # építene, de a saját devDependencyjei (tsup, vite) csak akkor vannak meg, ha a
      # csomagban MAGÁBAN is lefutott az install. Enélkül a ventMail `npm ci`-je
      # `tsup: not found` (127) hibával áll meg — mérve, az első futáson, amikor a
      # `VENTURE_PACKAGES_TOKEN` végre megvolt.
      - name: '@venture/sdk telepítése és építése'
        env:
          PACKAGES_TOKEN: ${{ secrets.VENTURE_PACKAGES_TOKEN }}
        run: |
          # Egy esetleges `git+ssh` függőség miatt: a runneren nincs SSH-kulcs (`Permission
          # denied (publickey)`, exit 128 — mérve). A rewrite ezért kell.
          #
          # A token KIZÁRÓLAG ennek a lépésnek a környezetében él (`GIT_CONFIG_*`), NEM a
          # globális `~/.gitconfig`-ban: a workflow végig `persist-credentials: false`-szal
          # dolgozik, épp azért, hogy egy PR-ből érkező npm lifecycle-script ne tudja
          # kiolvasni a tokent (security-review B2). Egy globális gitconfig ezt a rést
          # nyitná ki újra — a step-szintű env csak a @venture/sdk saját scriptjeinek
          # látszik, a ventMail `npm ci`-jének már nem.
          export GIT_CONFIG_COUNT=2
          export GIT_CONFIG_KEY_0="url.https://x-access-token:${PACKAGES_TOKEN}@github.com/.insteadOf"
          export GIT_CONFIG_VALUE_0="ssh://git@github.com/"
          export GIT_CONFIG_KEY_1="url.https://x-access-token:${PACKAGES_TOKEN}@github.com/.insteadOf"
          export GIT_CONFIG_VALUE_1="git@github.com:"

          for pkg in venture-sdk; do
            dir="${GITHUB_WORKSPACE}/_packages/${pkg}"
            [ -f "${dir}/package.json" ] || continue
            npm --prefix "${dir}" ci --no-audit --no-fund
            npm --prefix "${dir}" run build --if-present
          done

      - name: npm ci (letöltés, scriptek nélkül — lásd a frontend jobot)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s\n' '@venture-co-group:registry=https://npm.pkg.github.com' \
            '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}' > .npmrc
          npm ci --no-audit --no-fund --ignore-scripts
          rm .npmrc

      - name: npm rebuild (lifecycle-scriptek, token nélkül)
        run: npm rebuild

      # A böngésző a LEFORDÍTOTT frontendet kapja: Vite-manifest nélkül minden Inertia-oldal
      # 500-at adna, és a teszt a build hiányát mérné, nem a képernyőt.
      - name: vite build
        run: npm run build

      - name: 'alkalmazás előkészítése'
        run: |
          cp .env.example .env
          php artisan key:generate

          # AUDIT_PEPPER: futásonként generált, eldobható érték — UGYANAZ az idióma, mint a
          # backend jobban.
          #
          # A `.env.example`-ben szándékosan ÜRES (a repó nem szállít titkot), a `KeyedHash`
          # viszont fail-closed: üres pepperrel HANGOSAN dob, nem ad csendben gyenge hasht.
          # Ez helyes — de a demó-adat seedelése emiatt 500-zal állt meg, és a napló-flow
          # mindhárom tesztje ÜRES naplón futott (mérve: „0 sor", három bukó teszt). A hiba
          # eddig láthatatlan volt, mert a Playwright-kapu a hiányzó privát csomagok miatt
          # el sem jutott a futtatásig.
          php artisan ventmail:pepper | sed 's/^/AUDIT_PEPPER=/' >> .env

          php artisan migrate --force

      - name: playwright telepítése
        run: npx playwright install --with-deps chromium

      - name: playwright test
        run: npx playwright test

      # A BÖNGÉSZŐ-TESZT BUKÁSA MELLÉ A SZERVER SAJÁT SZAVA IS KELL.
      #
      # A Playwright csak azt látja, amit a böngésző kapott: „az elem nincs meg". Hogy a
      # kérés MIÉRT nem járt sikerrel (kivétel, kapu-elutasítás, 500), az kizárólag az
      # alkalmazás naplójában van — és a runner a futás végén eldobja. Mérve: egy CI-only
      # bukást (nálunk zöld, ott piros) e nélkül csak találgatni lehetett.
      - name: 'alkalmazás-napló bukás esetén'
        if: failure()
        run: |
          echo "::group::laravel.log (utolsó 300 sor)"
          tail -n 300 storage/logs/laravel.log 2>/dev/null || echo "nincs napló"
          echo "::endgroup::"

      # CI (PR #42) · A FOLYAMAT-SZINTŰ HALÁL NYOMAI. A `php -S` worker beragadása (100% CPU) vagy
      # elhalása (szegmentálási hiba, OOM-kill) az alkalmazás-naplóba nem kerül — itt látszik: a
      # futó PHP-folyamatok állapota/CPU-ideje és a kernel-napló vége, és a PHP effektív opcache/JIT
      # beállítása (a webszerver ugyanazzal az `e2e/php.d`-vel fut).
      - name: 'folyamatok és kernel-napló bukás esetén'
        if: failure()
        run: |
          echo "::group::PHP-folyamatok"
          ps -eo pid,ppid,stat,etime,pcpu,rss,args | grep -E '[p]hp' || echo "nincs futó PHP-folyamat"
          echo "::endgroup::"
          echo "::group::kernel-napló (utolsó 80 sor)"
          sudo dmesg -T 2>/dev/null | tail -n 80 || echo "dmesg nem olvasható"
          echo "::endgroup::"
          echo "::group::PHP opcache/JIT (e2e/php.d-vel)"
          PHP_INI_SCAN_DIR=":$PWD/e2e/php.d" php -i | grep -E '^(opcache\.enable_cli|opcache\.jit |JIT)' || true
          echo "::endgroup::"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # v1.1 · 8. modul (D237): a PDF-renderer KONTRAKTUSA a valódi, pinelt Gotenberg ellen. A fixtúra-
  # riport ECharts-grafikonokat tartalmaz: a `waitForExpression` + `failOnConsoleExceptions` bizonyítja,
  # hogy a riport-JS hálózat nélkül, hiba nélkül kirajzol, és a PDF legalább kétoldalas.
  gotenberg-contract:
    name: Gotenberg kontraktus (PDF-riport)
    runs-on: ubuntu-latest
    needs: frontend
    permissions:
      contents: read

    # A kontraktus a VALÓDI riport-láncot rendereli (builder + Blade + riport-csomag): adatbázis kell.
    services:
      db:
        image: timescale/timescaledb-ha:pg17
        env:
          POSTGRES_DB: ventmail_test
          POSTGRES_USER: ventmail
          POSTGRES_PASSWORD: ventmail
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U ventmail -d ventmail_test"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=5s --health-retries=20

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: ventmail_test
      DB_USERNAME: ventmail
      DB_PASSWORD: ventmail
      DB_SSLMODE: disable
      REDIS_HOST: 127.0.0.1

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: public/build (a frontend job riport-csomagja)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: public-build
          path: public/build

      # UGYANAZ a sidecar, mint élesben: a deploy/compose.render.yml (image digest, flagek, belső háló,
      # read-only, tmpfs /tmp + /home/gotenberg, cap_drop) — és egy teszt-csak ingress-proxy.
      - name: Gotenberg (deploy/compose.render.yml)
        run: deploy/tests/gotenberg-up.sh

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, redis, intl, zip, bcmath, pcntl, gd
          coverage: none

      - name: composer install
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: env
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan ventmail:pepper | sed 's/^/AUDIT_PEPPER=/' >> .env

      - name: php artisan test --group=gotenberg
        env:
          GOTENBERG_URL: http://127.0.0.1:3000
        run: php artisan test --group=gotenberg

      - name: Gotenberg napló (hiba esetén)
        if: failure()
        run: docker compose -p ventmail-render -f deploy/compose.render.yml logs

  security:
    name: Security (gitleaks)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # A gitleaks-action szervezeti repónál licencet követel; a binárist futtatjuk.
      # A release asset ugyanazon a tagen lecserélhető, ezért checksum-ellenőrzés kell.
      - name: gitleaks
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSLo gitleaks.tar.gz "${base}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSLo checksums.txt "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" checksums.txt \
            | sed "s|gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz|gitleaks.tar.gz|" \
            | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . --config .gitleaks.toml --redact --no-banner --exit-code 1
