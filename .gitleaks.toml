# gitleaks konfiguráció.
#
# Az allowlist KIZÁRÓLAG teszt-vektorokat és dokumentált dev-hitelesítőt tartalmaz.
# Minden bejegyzésnél kötelező az indoklás: miért nem valódi titok, és mi garantálja, hogy
# az is marad.

title = "ventMail"

[extend]
useDefault = true

# ─────────────────────────────────────────────────────────────────────────────
# SAJÁT SZABÁLY: URL-be ágyazott Basic Auth hitelesítő — a userinfo két tagja (név ÉS
# jelszó) a séma és a hoszt között.
#
# Miért kell, ha a gitleaks alap-szabálykészlete fut: mérve NEM fogja meg. A
# GitGuardian igen — és egy TESZT-FIXTÚRÁN kapott el minket
# (egy webhook-URL, aminek a userinfója nevet ÉS jelszót is tartalmazott, C2). A saját kapunknak
# ugyanazt kell tudnia, mint a külső szkennernek: ha csak a külső fogja meg, a
# hibát a PR-en látjuk meg, nem a commit előtt — és a történetből már nem
# takarítható ki.
#
# A fixtúra ettől nem lesz „ártalmatlanabb": a helyes válasz az, hogy a teszt NE
# hitelesítő-alakot használjon, ha nem a hitelesítő a tárgya.
# ─────────────────────────────────────────────────────────────────────────────
[[rules]]
id = "url-basic-auth"
description = "URL-be ágyazott Basic Auth hitelesítő a userinfo mezőben"
regex = '''[a-zA-Z][a-zA-Z0-9+.-]*:\/\/[^\s:@\/]{1,64}:[^\s:@\/]{1,64}@[^\s\/]{1,255}'''
tags = ["basic-auth", "url"]

[rules.allowlist]
# A séma-példák és a dokumentált placeholderek nem hitelesítők.
regexes = [
  ''':\/\/[^\s:@\/]{1,64}:(jelszo|password|jelszó|<[^>]+>|\$\{[^}]+\}|:[a-z_]+)@''',
]

# A C2 MERGE-COMMITJA (`aa43085b…`) — TÖRTÉNETI kivétel, egyetlen SHA-ra.
#
# Ebben a commitban egy teszt-fixtúra olyan URL-t használt, aminek a userinfója nevet ÉS
# jelszót is tartalmazott — azért, hogy
# bizonyítsa: az audit-pszeudonimizálás nem eszi meg a HOSZTNEVET. Nem valódi hitelesítő —
# nincs mit visszavonni —, és a fixtúra a következő commitban jelszó nélküli userinfóra
# cserélődött (a teszt tárgyához a jelszó nem kellett).
#
# Miért SHA-ra szól a kivétel, és nem fájlnévre: a már MERGELT `main`-történet átírása egy
# fake teszt-hitelesítőért aránytalan (más ágakat törne el), viszont ha ugyanezekben a
# fájlokban ÚJRA megjelenik egy ilyen alak, annak el KELL buknia. Egy fájl-alapú kivétel
# ezt örökre kinyitná.
commits = ["aa43085b20a32fbdb415764ff2473a6675aa2489"]

[allowlist]
description = """
1) tests/Fixtures/dkim-test-key.pem — DKIM KAT-vektor (known-answer test).
   Miért fix kulcs: a KAT lényege, hogy a kimenet LITERÁL elvárt értékhez hasonlítódik.
   Futásidőben generált kulccsal a teszt a saját implementációját ismételné meg, és egy
   regressziót (pl. elrontott PEM-fejléc-eltávolítás) nem venne észre.
   Miért nem kockázat: ez a kulcs sosem kerül DNS-be és nem ír alá éles levelet; az éles
   kulcsok futásidőben, domainenként keletkeznek és titkosítva tárolódnak.

2) docker/caddy.dev.env — a lokális dev-stack Basic Auth bcrypt hashe (jelszó: ventmail-dev).
   A felület loopbackra kötött, a jelszó dokumentált, a fájlnév is jelzi, hogy dev.
   Üres hash esetén a Caddy el sem indulna (fail-closed), ezért kell benne értéknek lennie.

3) tests/Feature/Schema/CryptoVectorsTest.php — a KeyedHash KAT-vektora.
   A bejelölt „titok" a teszt FIX PEPPERE (`teszt-pepper-…`), amit a teszt maga állít be a
   `config(['audit.pepper' => …])`-en. Ugyanaz az indok, mint a DKIM-kulcsnál: a KAT lényege
   a literál elvárt kimenet — futásidőben generált pepperrel a teszt a saját
   implementációját ismételné meg, és egy elcsúszó normalizálást nem venne észre.
   Miért nem kockázat: az éles pepper KIZÁRÓLAG env-ből jön (`AUDIT_PEPPER`), és a hiánya
   HANGOS hiba, nem csendes gyenge hash — ezt a szomszédos teszt bizonyítja.

4) tests/Feature/Suppression/UnsubscribeTokenVectorsTest.php és
   tests/Feature/Logs/TrackingTokenVectorsTest.php — BEÉGETETT token-KAT-vektorok.
   A bejelölt „titok" egy CSUPA NULLA `APP_KEY`-jel (`base64:AAAA…`) titkosított token,
   plusz maga a kulcs-literál. Miért van beégetve: a `p`/`v` mező bevezetése megváltoztatta
   a wire-formátumot, és a régi tokenek CSENDBEN érvénytelenek lettek — a `/u/` végpont
   szándékosan nem ad orákulumot, tehát a címzett a „leiratkoztál" oldalt látta volna,
   miközben semmi nem íródik. Ez a vektor a formátumot RÖGZÍTI: a következő néma
   formátumváltás a CI-ban bukik el, nem az ügyfél postafiókjában.
   Miért nem kockázat: a kulcs csupa nulla és a teszt állítja be; az éles `APP_KEY` env-ből
   jön, és a tokenben nincs más, mint a teszt saját kitalált workspace-e, üzenet-uuid-ja és
   `cimzett@example.test` címe.

5) tests/Feature/Consent/ConsentTokenVectorsTest.php — ugyanaz, a `optin` és `prefs`
   tokenekre. A `optin` a rendszer legérzékenyebb tokenje (JOGALAPOT teremt), ezért a
   wire-formátumát beégetett vektor rögzíti: egy néma formátumváltás a CI-ban bukik el, nem
   az ügyfél postafiókjában.

6) A REDAKCIÓT bizonyító tesztek szándékos ál-titkai (`vm_live_TITOK`, `NYERS-JELSZO`).
   Ezek pont attól hasznosak, hogy VALÓDINAK LÁTSZANAK: a teszt azt állítja, hogy az
   audit-naplóba nem kerülnek be. Ha a mintát „ártalmatlanabbra" cserélnénk, a teszt
   megszűnne bizonyítani bármit — épp azt a rést nyitná ki, amit a security-review talált.
"""
paths = [
  '''tests/Fixtures/dkim-test-key\.pem''',
  '''tests/Fixtures/dkim-test-key\.pub\.pem''',
  '''docker/caddy\.dev\.env''',
  '''tests/Feature/Schema/AuditCoverageTest\.php''',
  '''tests/Feature/Schema/RedactionVectorsTest\.php''',
  '''tests/Feature/Schema/CryptoVectorsTest\.php''',
  '''tests/Feature/Suppression/UnsubscribeTokenVectorsTest\.php''',
  '''tests/Feature/Logs/TrackingTokenVectorsTest\.php''',
  '''tests/Feature/Consent/ConsentTokenVectorsTest\.php''',
  '''\.gitleaks\.toml''',
]
