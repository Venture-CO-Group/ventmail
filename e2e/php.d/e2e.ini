; Az e2e webszerver (`php artisan serve`) kiegészítő PHP-beállításai.
;
; A CLI-szerver alapból 2 MB-os feltöltést és 8 MB-os POST-ot enged — a 300 000 soros
; kontakt-import CSV-je ~13 MB (az alkalmazás saját plafonja: AUDIENCE_IMPORT_MAX_MB, 100).
; Éles környezetben ezt a php-fpm konfigurációja adja (docker/php), itt az e2e-szervernek
; kell ugyanazt tudnia.
upload_max_filesize = 128M
post_max_size = 130M
memory_limit = 512M
max_execution_time = 0

; CI (PR #42) · NINCS JIT a CLI-ben, pontosan mint élesben (docker/php/php.ini: opcache.enable_cli = 0;
; az éles FPM-ben a jit_buffer_size 0). A GitHub-runner setup-php-ja alapból bekapcsolja az opcache
; tracing JIT-et a CLI-re; a `php -S` workerek alatt ez végtelen ciklusba futott (100% CPU, „Maximum
; execution time of 0 seconds exceeded") — a worker beragadt, a szerver elérhetetlenné vált.
; Mérve: linux/amd64 + setup-php-szerű ini → az analitika-spec bukik; e nélkül zöld.
opcache.enable_cli = 0
opcache.jit = disable
