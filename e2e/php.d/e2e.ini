; Az e2e webszerver (`php artisan serve`) kiegészítő PHP-beállításai.
;
; A CLI-szerver alapból 2 MB-os feltöltést és 8 MB-os POST-ot enged — a 300 000 soros
; kontakt-import CSV-je ~13 MB (az alkalmazás saját plafonja: AUDIENCE_IMPORT_MAX_MB, 100).
; Éles környezetben ezt a php-fpm konfigurációja adja (docker/php), itt az e2e-szervernek
; kell ugyanazt tudnia.
upload_max_filesize = 128M
post_max_size = 130M
memory_limit = 512M
max_execution_time = 0
