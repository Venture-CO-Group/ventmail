# ventMail state that outlives a release: Redis (sessions, cache, queues). One instance, shared by the blue and green colours, so a
# colour switch logs nobody out. Never part of a colour; never removed by deploy.sh.
name: ventmail-data

services:
  redis:
    image: redis:8.8.3-alpine
    restart: unless-stopped
    # Only the Redis password, interpolated from .env; never the whole file.
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD missing from .env}
    # The password is written to a private tmpfs config instead of argv, so it
    # never shows up in a process listing.
    command:
      - sh
      - -c
      - >-
        umask 077 && printf 'requirepass %s\n' "$$REDIS_PASSWORD" > /tmp/redis.conf &&
        exec redis-server /tmp/redis.conf --appendonly yes --maxmemory 1gb --maxmemory-policy noeviction
    tmpfs: [/tmp]
    volumes:
      - redis:/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    mem_limit: 1280m
    cpus: 0.5

networks:
  data:
    name: ventmail-data

volumes:
  redis:
    name: ventmail-redis
