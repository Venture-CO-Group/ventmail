# One ventMail release ("colour"). deploy.sh runs it as compose project
# ventmail-blue or ventmail-green with VENTMAIL_TAG + VENTMAIL_COLOR set, next to
# the colour already serving, and retires the old colour only once the new one
# is healthy. Shared state (Redis) lives in compose.data.yml.
#
# Networks (all created by venture-infra boxes/mail bootstrap-host.sh):
#   edge        the mail-box edge reaches `web` as ventmail-web-<colour>:8080
#   mail-db     Postgres (internal)
#   postal-api  the two Postal instances (internal): the app/worker call their
#               HTTP API, and they deliver signed webhooks to `ventmail-web`
#   data        Redis (this app's own)
#   render      the Gotenberg PDF sidecar (compose.render.yml, internal, no egress): only `app`
#               and `worker` call it (the report job runs on the worker's `reports` queue)
#
# Shared storage (D227): every PHP role (app, worker, worker-imports, scheduler,
# ops) sees ONE storage/app: an import upload written by `app` is read by
# `worker-imports`, a PDF report rendered by `worker` is downloaded through `app`.
# Two external, named volumes that deploy.sh creates (never removes):
#   ventmail-storage         -> /app/storage/app          (private: imports, reports, logos)
#   ventmail-storage-public  -> /app/storage/app/public   (template images, D10)
# `web` mounts only the public one, read-only, and serves it under /storage/*.
# Both colours mount the same volumes: a colour switch loses no file.
# Nothing here publishes a host port - Docker would bypass ufw for it - and no
# service here may send SMTP itself (the box's DOCKER-USER guard resets it).

x-php: &php
  image: ghcr.io/venture-co-group/ventmail:${VENTMAIL_TAG:?VENTMAIL_TAG is set by deploy.sh}
  env_file: .env
  restart: unless-stopped
  networks: [default, data, mail-db, postal-api]

services:
  app:
    <<: *php
    command: ["app"]
    networks: [default, data, mail-db, postal-api, render]
    volumes:
      - fpm:/run/php
      - storage:/app/storage/app
      - storage-public:/app/storage/app/public
    stop_signal: SIGQUIT
    stop_grace_period: 30s
    mem_limit: 2g
    cpus: 2.0

  # The send queue. Bounded, so a runaway job can never starve the MTAs.
  worker:
    <<: *php
    command: ["worker"]
    networks: [default, data, mail-db, postal-api, render]
    volumes:
      - storage:/app/storage/app
      - storage-public:/app/storage/app/public
    stop_signal: SIGTERM
    stop_grace_period: 60s
    mem_limit: 2g
    cpus: 2.0

  # The contact-import queues (imports, imports-inspect), isolated from the send queue: a
  # byte-heavy upload can exhaust memory, and in a shared cgroup that would OOM-kill the
  # sending Horizon too. Own limits, own container; `artisan horizon --environment=imports`.
  worker-imports:
    <<: *php
    command: ["worker-imports"]
    volumes:
      - storage:/app/storage/app
      - storage-public:/app/storage/app/public
    stop_signal: SIGTERM
    stop_grace_period: 60s
    mem_limit: 3g
    cpus: 2.0

  scheduler:
    <<: *php
    command: ["scheduler"]
    volumes:
      - storage:/app/storage/app
      - storage-public:/app/storage/app/public
    mem_limit: 512m
    cpus: 0.5

  web:
    image: ghcr.io/venture-co-group/ventmail:${VENTMAIL_TAG:?VENTMAIL_TAG is set by deploy.sh}
    command: ["web"]
    environment:
      APP_URL: ${APP_URL:?APP_URL missing from .env}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:?TRUSTED_PROXIES missing from .env}
    volumes:
      - fpm:/run/php
      # Only the public files (template images), read-only; Caddy serves them as
      # plain files under /storage/* (Caddyfile.web), never through PHP.
      - storage-public:/app/storage/app/public:ro
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    networks:
      default: {}
      edge:
        aliases: ["ventmail-web-${VENTMAIL_COLOR:?VENTMAIL_COLOR is set by deploy.sh}"]
      # One stable name for the Postal webhooks, whichever colour is serving.
      postal-api:
        aliases: ["ventmail-web"]
    mem_limit: 256m
    cpus: 0.5

  # One-off maintenance container (migrate, provisioning commands).
  ops:
    image: ghcr.io/venture-co-group/ventmail:${VENTMAIL_TAG:?VENTMAIL_TAG is set by deploy.sh}
    profiles: ["ops"]
    env_file: .env
    entrypoint: ["php"]
    command: ["artisan", "list"]
    volumes:
      - storage:/app/storage/app
      - storage-public:/app/storage/app/public
    networks: [default, data, mail-db, postal-api]
    mem_limit: 1g
    cpus: 1.0

networks:
  default: {}
  data:
    name: ventmail-data
    external: true
  mail-db:
    name: mail-db
    external: true
  postal-api:
    name: postal-api
    external: true
  edge:
    name: edge
    external: true
  render:
    name: ventmail-render
    external: true

volumes:
  fpm: {}
  storage:
    name: ventmail-storage
    external: true
  storage-public:
    name: ventmail-storage-public
    external: true
