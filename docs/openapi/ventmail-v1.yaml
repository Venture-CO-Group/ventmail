openapi: 3.1.0

info:
  title: ventMail API
  version: 1.0.0
  description: |
    A ventMail publikus küldő felülete — **Mailgun-kompatibilis**.

    A cél, hogy a Mailgun Messages API-ra írt integráció **kódmódosítás nélkül** átjöjjön:
    csak a bázis-URL és a kulcs cserélődik. Ezért követi a `o:` / `h:` / `v:` prefixelt
    paraméterek szemantikáját, beleértve a „elnéző" logikai értékeket (`yes`/`true`/`1`).

    **Stabilitás:** ami ebben a leírásban szerepel, az SZERZŐDÉS. A `/v1` nem kap
    breaking change-et; új mező csak opcionálisként jöhet.

    **Változásnapló (GA előtt).** A `/v1` a GA napján fagy be; addig itt vezetjük, mi
    változott, hogy a korai integrációk ne csendben törjenek el:

    - `o:channel`: a `journey` és a `campaign` érték a publikus API-ról ELTÁVOLÍTVA (a
      Journey/Campaign motor belső csatornái — a sor-prioritás miatt nem választhatók).
    - A `marketing` csatorna mostantól KÉT feltételt kér: `messages:send:marketing` scope
      ÉS a kulcshoz rendelt csatorna-jog (`api_keys.channels`). A meglévő kulcsok
      alapértelmezése `transactional`, tehát új jogot ez a változás nem ad.
      A csatorna CÍMKE marad: azt, hogy valaki marketing tartalmat küld tranzakciósnak
      jelölve, tartalomból nem lehet megállapítani — ott a panasz- és bounce-arány figyelése
      a védelem, nem az API.
    - `POST /v1/messages.mime`: a nem értelmezett `o:` vezérlő mostantól HIBA
      (`UNSUPPORTED_MIME_OPTION`), nem csendes eldobás.
    - **A leiratkozó fejléc a ventMailé** (RFC 8058 one-click). A `h:List-Unsubscribe` a
      strukturált végponton `VALIDATION_ERROR`, a nyers MIME-ban `UNSUPPORTED_MIME_HEADER`.
      Indok: a fejléc a címzett SZEMÉLYÉHEZ kötött, visszavonhatatlan hatású tokent hordoz;
      ha az értéke kívülről jöhetne, nekünk kellene felismernünk, hogy a benne lévő token a
      miénk-e — és ez a felismerés (URL-alak, betűzés, százalék-kódolás) sorra
      megkerülhetőnek bizonyult. A saját preference center linkje a levél TÖRZSÉBE megy.
    - **Consent-köteles csatornán a nyers MIME EGY címzettre küldhető** (`MIME_BULK_MARKETING`).
      A nyers levél egyetlen bájtsor, amit minden címzett ugyanúgy kap meg; egy közös
      leiratkozó tokennel a második címzett leiratkozása az elsőt vinné a suppression-listára.
      Tömeges marketinghez a strukturált végpont vagy a tárolt sablon való — ott a MIME-ot mi
      építjük címzettenként.
    - Ugyanaz az `Idempotency-Key` MÁS kérés-tartalommal `409 IDEMPOTENCY_KEY_REUSED`
      (korábban csendben eldobta a második levelet).

servers:
  - url: https://api.ventmail.app/v1
    description: éles
  - url: http://localhost:8088/v1
    description: lokális fejlesztés

security:
  - bearerAuth: []
  - basicAuth: []

tags:
  - name: messages
    description: Küldés (strukturált és nyers MIME)
  - name: templates
    description: Tárolt sablonok verziózással

paths:
  /messages:
    post:
      tags: [messages]
      summary: Üzenet küldése
      description: |
        Strukturált küldés. Minden hívás a **PreSendGate** hat kapuján megy át; az elutasítás
        `422`-t ad a gate strukturált kódjával (`error.code`).

        Batch: legfeljebb 1000 címzett hívásonként, `recipient-variables`-szel címzettre
        bontott behelyettesítéssel.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SendMessageRequest' }
          multipart/form-data:
            schema: { $ref: '#/components/schemas/SendMessageRequest' }
      responses:
        '202':
          description: Elfogadva (sorba állítva vagy elküldve)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SendAccepted' }
        '400':
          description: Formai hiba — a kérés így soha nem lett volna teljesíthető
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Hiányzó vagy érvénytelen API-kulcs
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: A kulcshoz hiányzik a `messages:send` scope
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: A PreSendGate elutasította (a `error.code` a gate strukturált oka)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: |
            Az `Idempotency-Key` már használt MÁS kérés-tartalommal. A második levél NEM ment ki.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: Rate-limit

  /messages.mime:
    post:
      tags: [messages]
      summary: Nyers MIME küldése
      description: |
        A kész MIME-levél továbbítása `multipart/form-data`-ként (a `message` mezőben).
        A fejlécek megőrizve; a `to` felülírhatja a MIME `To:` fejlécét (boríték-címzett).

        A gate itt is megkerülhetetlen.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [message]
              properties:
                message:
                  type: string
                  format: binary
                  description: A nyers MIME-levél
                to:
                  type: string
                  description: Boríték-címzett(ek), vesszővel elválasztva
      responses:
        '202':
          description: Elfogadva
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SendAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Rejected' }

  /templates:
    get:
      tags: [templates]
      summary: Tárolt sablonok listája
      responses:
        '200':
          description: A sablonok és verzióik
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Template' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [templates]
      summary: Sablon létrehozása
      description: Az első verzió azonnal aktív lesz — különben a `template=` küldés némán elbukna.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, template]
              properties:
                name:
                  type: string
                  maxLength: 128
                  pattern: '^[a-z0-9][a-z0-9._-]*$'
                description: { type: string, maxLength: 255 }
                template: { type: string, description: 'HTML törzs `{{ változó }}` merge-tagekkel' }
                text: { type: string, description: 'Plaintext változat' }
      responses:
        '201':
          description: Létrejött
          content:
            application/json:
              schema:
                type: object
                properties:
                  template:
                    type: object
                    properties:
                      name: { type: string }
                      version: { type: integer }
                      active: { type: boolean }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /templates/{name}/versions:
    post:
      tags: [templates]
      summary: Új sablon-verzió
      description: |
        A verziók MEGVÁLTOZTATHATATLANOK: ami egyszer kimehetett egy levélben, azt utólag
        nem írjuk át. Módosítás = új verzió; az `active` dönti el, hogy azonnal éles legyen.
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [template]
              properties:
                template: { type: string }
                text: { type: string }
                active: { type: boolean, default: false }
      responses:
        '201':
          description: A verzió létrejött
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    type: object
                    properties:
                      version: { type: integer }
                      active: { type: boolean }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /events:
    get:
      summary: Események lekérdezése (kurzoros lapozással)
      description: |
        A Mailgun events API paritása. A LAPOZÁS KURZOROS, és ez nem stílus kérdése: az
        eseménytábla folyamatosan nő, tehát offset-lapozásnál a második oldal lekérésekor a
        sorok elcsúsznak — a hívó ugyanazt az eseményt kétszer kapja meg, vagy sosem látja.
        Egy suppression-szinkron ebből csendben rossz adatot építene.

        A kurzor az `(occurred_at, id)` páros: az `occurred_at` önmagában nem egyedi, egy
        batch ezer eseménye ugyanabban a másodpercben keletkezik.
      operationId: listEvents
      security: [{ bearerAuth: [] }, { basicAuth: [] }]
      parameters:
        - { name: type, in: query, schema: { type: string }, description: 'esemény-típus (többször is megadható)' }
        - { name: recipient, in: query, schema: { type: string } }
        - { name: channel, in: query, schema: { type: string, enum: [transactional, marketing] } }
        - { name: message_id, in: query, schema: { type: string } }
        - { name: tag, in: query, schema: { type: string } }
        - { name: since, in: query, schema: { type: string, format: date-time } }
        - { name: until, in: query, schema: { type: string, format: date-time } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 300, default: 100 } }
        - { name: cursor, in: query, schema: { type: string }, description: 'az előző válasz `paging.next` értéke' }
      responses:
        '200':
          description: Események
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Event' } }
                  paging:
                    type: object
                    properties:
                      next: { type: [string, 'null'], description: 'a következő oldal kurzora' }
        '401':
          description: Hiányzó vagy érvénytelen API-kulcs
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /webhooks/deliveries:
    get:
      summary: Webhook-kézbesítések (a dead-letter sorral együtt)
      operationId: listWebhookDeliveries
      security: [{ bearerAuth: [] }, { basicAuth: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [pending, delivered, failed, dead_letter] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: Kézbesítések
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/WebhookDelivery' } }
        '401':
          description: Hiányzó vagy érvénytelen API-kulcs
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /webhooks/deliveries/{uuid}/replay:
    post:
      summary: Egy kézbesítés újrajátszása a dead-letter sorból
      description: |
        A dead-letter sor csak akkor ér valamit, ha van belőle kivezető út: az ügyfél
        megjavítja a végpontot, és újraküldeti, ami nem jutott el. A sikeres replay
        `delivered`-re állítja a sort, tehát a lista magától ürül.
      operationId: replayWebhookDelivery
      security: [{ bearerAuth: [] }, { basicAuth: [] }]
      parameters:
        - { name: uuid, in: path, required: true, schema: { type: string } }
      responses:
        '202':
          description: Sorba téve
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  status: { type: string, enum: [queued] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /webhooks/endpoints:
    get:
      tags: [webhooks]
      summary: A webhook-végpontok listája
      operationId: listWebhookEndpoints
      security: [{ bearerAuth: [] }, { basicAuth: [] }]
      responses:
        '200':
          description: A végpontok
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/WebhookEndpoint' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [webhooks]
      summary: Webhook-végpont létrehozása
      description: |
        A titok EGYSZER, ebben a válaszban látszik — utána már csak az aláírásunkban él.
        Az URL-nek `https`-nek kell lennie, és publikus címre kell mutatnia: a belső háló,
        a loopback és a felhő-metadata tartománya tiltott (`INVALID_WEBHOOK_URL`).
      operationId: createWebhookEndpoint
      security: [{ bearerAuth: [] }, { basicAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, url]
              properties:
                name: { type: string, maxLength: 120 }
                url: { type: string, maxLength: 2048 }
                events:
                  type: array
                  description: Üres vagy hiányzó lista = MINDEN esemény.
                  items: { $ref: '#/components/schemas/EventType' }
      responses:
        '201':
          description: Létrehozva — a titokkal együtt
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/WebhookEndpoint' }
                  - type: object
                    properties:
                      secret: { type: string, description: 'Csak MOST látszik.' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /webhooks/endpoints/{uuid}:
    patch:
      tags: [webhooks]
      summary: Webhook-végpont módosítása
      operationId: updateWebhookEndpoint
      security: [{ bearerAuth: [] }, { basicAuth: [] }]
      parameters:
        - { name: uuid, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 120 }
                url: { type: string, maxLength: 2048 }
                events: { type: array, items: { $ref: '#/components/schemas/EventType' } }
                active: { type: boolean }
      responses:
        '200':
          description: Módosítva
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookEndpoint' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [webhooks]
      summary: Webhook-végpont törlése
      operationId: deleteWebhookEndpoint
      security: [{ bearerAuth: [] }, { basicAuth: [] }]
      parameters:
        - { name: uuid, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Törölve }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /webhooks/endpoints/{uuid}/rotate-secret:
    post:
      tags: [webhooks]
      summary: A végpont aláíró titkának cseréje
      description: |
        A RÉGI titok AZONNAL érvénytelen — nincs átfedési ablak. A rotációt jellemzően
        szivárgás váltja ki, olyankor pedig a „még pár percig érvényes" a támadónak kedvez.
      operationId: rotateWebhookEndpointSecret
      security: [{ bearerAuth: [] }, { basicAuth: [] }]
      parameters:
        - { name: uuid, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Az ÚJ titok — csak most látszik
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/WebhookEndpoint' }
                  - type: object
                    properties:
                      secret: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /validate:
    post:
      tags: [validation]
      summary: Egy cím ellenőrzése (szinkron)
      description: |
        NYOLC ellenőrzés: szintaxis · domain+MX · szerepcím · eldobható domain · catch-all ·
        elgépelés-javaslat · kockázati pontszám · minősítés.

        A `result` az a NÉGY szó, amit a felületen mutatni kell; a `risk` a folytonos
        pontszám, amivel a küldési kapu dönt. Az `unknown` nem hiba: a catch-all szerver és a
        greylisting mögött nincs igazság, amit ki lehetne deríteni — és a hamis bizonyosság
        rosszabb, mint a bevallott bizonytalanság.
      operationId: validateAddress
      security: [{ bearerAuth: [] }, { basicAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [address]
              properties:
                address: { type: string, maxLength: 320 }
      responses:
        '200':
          description: Az eredmény
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationVerdict' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /validate/bulk:
    post:
      tags: [validation]
      summary: Címlista ellenőrzése (aszinkron)
      description: |
        CSV-fájl vagy címtömb. A feldolgozás DARABOKBAN megy: a szonda per-domain kerete
        percenként töltődik, tehát a folyamatos futás úgyis abba ütközne — a lassítás itt
        FUNKCIÓ, nem korlát.
      operationId: validateBulk
      security: [{ bearerAuth: [] }, { basicAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 120 }
                addresses: { type: array, items: { type: string, maxLength: 320 } }
          multipart/form-data:
            schema:
              type: object
              properties:
                name: { type: string }
                file: { type: string, format: binary, description: 'CSV — az első oszlop a cím' }
      responses:
        '202':
          description: Sorba téve
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationJob' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /validate/bulk/{uuid}:
    get:
      tags: [validation]
      summary: Egy bulk futás állapota
      operationId: showValidationJob
      security: [{ bearerAuth: [] }, { basicAuth: [] }]
      parameters:
        - { name: uuid, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Az állapot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationJob' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /validate/bulk/{uuid}/export:
    get:
      tags: [validation]
      summary: A bulk futás eredménye CSV-ben
      operationId: exportValidationJob
      security: [{ bearerAuth: [] }, { basicAuth: [] }]
      parameters:
        - { name: uuid, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: CSV
          content:
            text/csv:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /routes:
    get:
      tags: [inbound]
      summary: A bejövő route-szabályok listája
      operationId: listInboundRoutes
      security: [{ bearerAuth: [] }, { basicAuth: [] }]
      responses:
        '200':
          description: A szabályok, prioritás szerint
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/InboundRoute' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [inbound]
      summary: Route-szabály létrehozása
      description: |
        A szabályok PRIORITÁS szerint értékelődnek ki, azonos prioritásnál a létrehozás
        sorrendjében. Az első `stop()` akció lezárja a láncot.

        A kifejezést MENTÉSKOR is ellenőrizzük — az elgépelt regex azonnal hibát ad, nem
        három nap múlva abból, hogy „nem jön a levél".
      operationId: createInboundRoute
      security: [{ bearerAuth: [] }, { basicAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InboundRouteInput' }
      responses:
        '201':
          description: |
            Létrehozva — az ALÁÍRÓ TITOKKAL együtt. A titok csak MOST látszik; a
            `forward(url)` ezzel írja alá a POST-ot, és a fogadó ezzel ellenőrzi.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/InboundRoute' }
                  - type: object
                    properties:
                      signing_secret: { type: string, description: 'Csak MOST látszik.' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /routes/{uuid}:
    patch:
      tags: [inbound]
      summary: Route-szabály módosítása
      operationId: updateInboundRoute
      security: [{ bearerAuth: [] }, { basicAuth: [] }]
      parameters:
        - { name: uuid, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InboundRouteInput' }
      responses:
        '200':
          description: Módosítva
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InboundRoute' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [inbound]
      summary: Route-szabály törlése
      operationId: deleteInboundRoute
      security: [{ bearerAuth: [] }, { basicAuth: [] }]
      parameters:
        - { name: uuid, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Törölve }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /routes/{uuid}/rotate-secret:
    post:
      tags: [inbound]
      summary: A route `forward(url)` aláíró titkának cseréje
      description: |
        A RÉGI titok AZONNAL érvénytelen. A titok a szabály létrehozásakor egyszer látszik;
        ha elveszett, itt lehet újat kérni.
      operationId: rotateInboundRouteSecret
      security: [{ bearerAuth: [] }, { basicAuth: [] }]
      parameters:
        - { name: uuid, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Az ÚJ titok — csak most látszik
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/InboundRoute' }
                  - type: object
                    properties:
                      signing_secret: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /inbound/messages:
    get:
      tags: [inbound]
      summary: A tárolt bejövő levelek
      description: |
        A `store()` akcióval eltett levelek. A RETENCIÓ rövid (alap 3 nap): a bejövő levél
        idegen tartalom, amit nem mi írtunk és nem a mi jogalapunkon tárolunk. A lejárat
        utáni 404 nem hiba, hanem a megígért adatminimalizálás.
      operationId: listInboundMessages
      security: [{ bearerAuth: [] }, { basicAuth: [] }]
      parameters:
        - { name: recipient, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [received, parsed, routed, failed, forward_failed] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: A levelek
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/InboundMessageSummary' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /inbound/messages/{uuid}:
    get:
      tags: [inbound]
      summary: Egy bejövő levél — ugyanaz a payload, amit a forward(url) POSTol
      operationId: showInboundMessage
      security: [{ bearerAuth: [] }, { basicAuth: [] }]
      parameters:
        - { name: uuid, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: A levél
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InboundMessage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /inbound/messages/{uuid}/raw:
    get:
      tags: [inbound]
      summary: A nyers MIME
      operationId: showInboundMessageRaw
      security: [{ bearerAuth: [] }, { basicAuth: [] }]
      parameters:
        - { name: uuid, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: A nyers levél
          content:
            message/rfc822:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /inbound/messages/{uuid}/attachments/{attachmentUuid}:
    get:
      tags: [inbound]
      summary: Csatolmány-letöltés lejáró, aláírt URL-lel
      description: |
        A FERTŐZÖTT csatolmányra NEM adunk linket (409). Nem a mi dolgunk kártevőt
        terjeszteni, még kérésre sem — az eredmény a `scan` mezőből olvasható.
      operationId: showInboundAttachment
      security: [{ bearerAuth: [] }, { basicAuth: [] }]
      parameters:
        - { name: uuid, in: path, required: true, schema: { type: string } }
        - { name: attachmentUuid, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: A letöltési link
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: { type: string }
                  content_type: { type: string }
                  size: { type: integer }
                  url: { type: string, description: 'lejáró, aláírt URL' }
                  expires_in: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: A csatolmány nem tölthető le (szkennelési eredmény)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /journeys/events:
    post:
      tags: [journeys]
      summary: API-esemény küldése egy journey-triggerhez
      description: |
        A `api_event` triggerű Customer Journey-k indítása egy külső rendszer eseményéből
        (elhagyott kosár, előfizetés-lejárat, CRM-állapotváltás).

        **Az `Idempotency-Key` kötelező** (golden rule 5): egy újrapróbált integráció-hívás
        különben MÁSODIK journey-futást indítana ugyanarra az emberre, tehát a címzett két
        párhuzamos levélsorozatot kapna. A `journey_runs` részleges egyedi indexe csak az
        AKTÍV futást védi — egy már befejezett journey-be az ismételt hívás újra beléptetne.

        **A `data` KORLÁTOS és csak skalár.** A payload a futás kontextusába kerül, ahol a
        `condition` lépés szűrhet rá — de ott nincs séma, és a mező a törlési kérés meg a
        retenció tárgya is. Legfeljebb 20 kulcs, értékenként 500 karakter, beágyazott
        objektum nélkül. Aki több adatot akar a döntéshez, szegmenst használ: az a
        kontakt-rekordból dolgozik, ami a GDPR-törlés útján amúgy is anonimizálódik.

        **A válasz nem mondja meg, létezik-e a cím a közönségben.** A `started` a nálunk
        indult futásokat számolja. Egy „ez a cím nincs a listán" válasz cím-létezés-
        orákulummá tenné a végpontot.
      operationId: createJourneyEvent
      security: [{ bearerAuth: [] }, { basicAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JourneyEventInput' }
      responses:
        '202':
          description: |
            Elfogadva. A `started` az elindult journey-futások száma — nulla is lehet
            (nincs ilyen triggerű aktív journey, nincs consent, vagy a címzett már fut).
          content:
            application/json:
              schema:
                type: object
                properties:
                  accepted: { type: boolean, example: true }
                  started: { type: integer, example: 1 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'A ventMail API-kulcs: `Authorization: Bearer vm_live_…`'
    basicAuth:
      type: http
      scheme: basic
      description: 'Mailgun-paritás: `api` felhasználónév + az API-kulcs jelszóként.'

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, maxLength: 255 }
      description: |
        **Kötelező** minden küldő POST-on. Ugyanaz a kulcs ugyanazt a választ adja, és NEM
        küld újra — enélkül egy megismételt hálózati kérés duplán kézbesítene.

  responses:
    BadRequest:
      description: Formai hiba
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Hiányzó vagy érvénytelen API-kulcs
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Hiányzó scope
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Rejected:
      description: A PreSendGate elutasította
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Nincs ilyen erőforrás ebben a workspace-ben
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    JourneyEventInput:
      type: object
      required: [email, event]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
          description: A címzett. A journey-be lépés a consent- és suppression-kapukon múlik.
        event:
          type: string
          maxLength: 100
          pattern: '^[A-Za-z0-9_.:-]+$'
          example: checkout_abandoned
          description: Az esemény neve — a journey trigger-configja ehhez illeszkedik.
        data:
          type: object
          maxProperties: 20
          additionalProperties: { type: string, maxLength: 500 }
          description: |
            Legfeljebb 20 SKALÁR kulcs. A futás kontextusába kerül, ahol a `condition`
            lépés `context_equals`-szel szűrhet rá. Beágyazott objektum nincs: az korlátlan
            mélységű személyes adatot hordozna egy séma nélküli mezőbe.
          example: { cart_total: '149000' }

    SendMessageRequest:
      type: object
      required: [from, to]
      properties:
        from:
          type: string
          description: '`Név <cim@domain>` vagy `cim@domain`. A domainnek hitelesítettnek kell lennie.'
        to:
          oneOf:
            - type: string
            - type: array
              items: { type: string }
              maxItems: 1000
          description: 'Címzett(ek). Batch esetén legfeljebb 1000.'
        subject: { type: string }
        html: { type: string }
        text: { type: string }
        template:
          type: string
          description: 'Tárolt sablon neve; a `v:*` változókkal helyettesítődik be.'
        recipient-variables:
          type: string
          description: |
            JSON: címzett → változók. Minden címzett a SAJÁT behelyettesítését kapja
            (`%recipient.kulcs%`, `%recipient_email%`).
        o:deliverytime:
          type: string
          description: 'RFC 2822 időpont. Nem lehet a múltban, és legfeljebb 7 nappal előre.'
        o:testmode:
          type: string
          description: 'Ha igaz, naplóz, de nem küld.'
        o:tag:
          type: array
          items: { type: string }
          maxItems: 3
          description: 'Legfeljebb 3 tag üzenetenként.'
        o:tracking: { type: string }
        o:tracking-clicks: { type: string, enum: ['yes', 'no', 'htmlonly'] }
        o:tracking-opens: { type: string }
        o:dkim: { type: string }
        o:require-tls: { type: string }
        o:sending-ip-pool: { type: string }
        o:channel:
          type: string
          enum: [transactional, marketing]
          default: transactional
          description: |
            A `transactional` az EGYETLEN consent-mentes csatorna, és ez az alapértelmezés.

            A `marketing` **külön scope-ot igényel** (`messages:send:marketing`), és
            megerősített (double opt-in) consentet a címzettre — enélkül `403
            CHANNEL_NOT_ALLOWED`, illetve `422 NO_CONSENT`.

            A `journey` és a `campaign` a Journey/Campaign motor BELSŐ csatornái (sor-prioritás
            miatt), a publikus API-ról nem választhatók.
      additionalProperties:
        description: '`h:X-*` egyedi fejlécek és `v:*` változók.'

    SendAccepted:
      type: object
      properties:
        id: { type: string, format: uuid, description: 'Az üzenet azonosítója (trace-hez).' }
        message: { type: string, example: 'Queued. Thank you.' }
        status:
          type: string
          enum: [accepted, scheduled, sending, sent, delivered, deferred]

    Template:
      type: object
      properties:
        name: { type: string }
        description: { type: string, nullable: true }
        versions:
          type: array
          items: { type: integer }
        active_version: { type: integer, nullable: true }

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { $ref: '#/components/schemas/ErrorCode' }
            message: { type: string, description: 'Emberi magyarázat. A KÓD a szerződés, ez segítség.' }
            details: { type: object, additionalProperties: true }

    Event:
      type: object
      properties:
        # UUID, nem sorszám: a belső `id` tenant-független szekvencia, amiből két hívásból
        # (09:00 → 10:00) bárki megbecsülné a platform teljes esemény-volumenét.
        id: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/EventType' }
        message_id: { type: string }
        recipient: { type: [string, 'null'] }
        channel: { type: string }
        reason: { type: [string, 'null'], description: 'a gate strukturált oka vagy a bounce osztálya' }
        tags: { type: array, items: { type: string } }
        variables: { type: object, additionalProperties: true, description: 'a `v:*` változók — az integrációk ebből azonosítják a saját rekordjaikat' }
        occurred_at: { type: string, format: date-time }

    ValidationVerdict:
      type: object
      properties:
        address: { type: string }
        result:
          type: string
          enum: [deliverable, risky, undeliverable, unknown]
          description: |
            `deliverable` — minden jel jó · `risky` — valószínűleg jó, de nem biztos
            (szerepcím, catch-all, eldobható domain) · `undeliverable` — biztosan rossz
            (szintaxis, nincs MX, a fogadó elutasította) · `unknown` — nem tudtuk eldönteni.
        risk: { type: number, minimum: 0, maximum: 1 }
        reasons:
          type: array
          items:
            type: string
            enum: [SYNTAX_INVALID, NO_MX_RECORD, ROLE_ADDRESS, DISPOSABLE_DOMAIN, CATCH_ALL_DOMAIN, MAILBOX_NOT_FOUND, PROBE_INCONCLUSIVE, POSSIBLE_TYPO]
        did_you_mean:
          type: [string, 'null']
          description: 'elgépelés-javaslat (`gmial.com` → `gmail.com`)'
        checks:
          type: object
          description: |
            Ellenőrzésenkénti részeredmény. MINDEN kulcs jelen van, a korai kilépésnél is —
            az integrátor nem indexelhet vakon egy hiányzó kulcsra. A bool mezők MINDENHOL
            azt jelentik: „rendben van-e".
          additionalProperties: true

    ValidationJob:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: [string, 'null'] }
        status: { type: string, enum: [pending, processing, completed, failed] }
        total: { type: integer }
        processed: { type: integer }
        summary:
          type: object
          properties:
            deliverable: { type: integer }
            risky: { type: integer }
            undeliverable: { type: integer }
            unknown: { type: integer }
        started_at: { type: [string, 'null'], format: date-time }
        finished_at: { type: [string, 'null'], format: date-time }
        expires_at: { type: [string, 'null'], format: date-time }

    InboundRouteInput:
      type: object
      required: [match_type, actions]
      properties:
        description: { type: string, maxLength: 255 }
        priority: { type: integer, minimum: 0, maximum: 100000, default: 100 }
        match_type: { type: string, enum: [match_recipient, match_header, catch_all] }
        match_field: { type: [string, 'null'], description: '`match_header` esetén a fejléc neve' }
        expression:
          type: [string, 'null']
          maxLength: 512
          description: |
            Reguláris kifejezés határolók nélkül (`^support@pelda\.hu$`). Időkorláttal és
            visszalépés-korláttal fut: a katasztrofális visszalépésű minta nem viszi el a
            feldolgozást, csak nem illeszkedik.
        actions:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: object
            required: [type]
            properties:
              type: { type: string, enum: [forward, store, stop] }
              target: { type: [string, 'null'], description: 'URL (csak https) vagy e-mail-cím' }
        active: { type: boolean, default: true }

    InboundRoute:
      allOf:
        - { $ref: '#/components/schemas/InboundRouteInput' }
        - type: object
          properties:
            id: { type: string, format: uuid }
            last_matched_at: { type: [string, 'null'], format: date-time }

    InboundMessageSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        sender: { type: [string, 'null'], description: 'null = null-sender (bounce)' }
        recipient: { type: string }
        subject: { type: [string, 'null'] }
        status: { type: string, enum: [received, parsed, routed, failed, forward_failed] }
        size: { type: integer }
        received_at: { type: [string, 'null'], format: date-time }
        expires_at: { type: [string, 'null'], format: date-time }

    InboundMessage:
      type: object
      description: Ugyanaz az alak, amit a `forward(url)` POSTol.
      properties:
        id: { type: string, format: uuid }
        timestamp: { type: [integer, 'null'] }
        sender: { type: [string, 'null'] }
        recipient: { type: string }
        subject: { type: [string, 'null'] }
        message-id: { type: [string, 'null'] }
        body-plain: { type: [string, 'null'] }
        body-html: { type: [string, 'null'] }
        stripped-text:
          type: [string, 'null']
          description: 'a törzs az idézett előzmény és az aláírás NÉLKÜL — a válasz-kezeléshez'
        headers: { type: object, additionalProperties: { type: string } }
        authentication:
          type: object
          properties:
            spf: { type: [string, 'null'] }
            dkim: { type: [string, 'null'] }
            dmarc: { type: [string, 'null'] }
            spam_score: { type: [number, 'null'] }
        attachments:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              content_type: { type: string }
              size: { type: integer }
              sha256: { type: string }
              scan: { type: string, enum: [pending, clean, infected, unavailable, rejected] }
              url:
                type: [string, 'null']
                description: 'lejáró letöltési URL — CSAK a tisztának bizonyult csatolmányra'

    EventType:
      type: string
      enum: [accepted, rejected, delivered, deferred, bounced, complained, unsubscribed, opened, clicked, stored]

    WebhookEndpoint:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        url: { type: string }
        events:
          type: array
          description: Üres lista = MINDEN esemény.
          items: { $ref: '#/components/schemas/EventType' }
        active: { type: boolean }
        last_success_at: { type: [string, 'null'], format: date-time }
        last_failure_at: { type: [string, 'null'], format: date-time }

    WebhookDelivery:
      type: object
      properties:
        id: { type: string }
        event: { type: string }
        message_id: { type: [string, 'null'] }
        status: { type: string, enum: [pending, delivered, failed, dead_letter] }
        attempt: { type: integer }
        response_code: { type: [integer, 'null'] }
        response_excerpt: { type: [string, 'null'], description: 'a válasz eleje (max 500 karakter)' }
        next_attempt_at: { type: [string, 'null'], format: date-time }
        dead_lettered_at: { type: [string, 'null'], format: date-time }

    ErrorCode:
      type: string
      description: |
        Stabil hibakódok. A gate strukturált okai VÁLTOZATLANUL jelennek meg itt — így a
        hívó ugyanazt látja, mint az üzenet-trace.
      enum:
        - UNAUTHENTICATED
        - TOO_MANY_REQUESTS
        - INSUFFICIENT_SCOPE
        - IDEMPOTENCY_KEY_REQUIRED
        - IDEMPOTENCY_KEY_TOO_LONG
        - IDEMPOTENCY_KEY_REUSED
        - INVALID_CHANNEL
        - CHANNEL_NOT_ALLOWED
        - UNSUPPORTED_ATTACHMENT
        - MIME_TOO_LARGE
        - MIME_MALFORMED
        - MIME_DUPLICATE_HEADER
        - MIME_BCC_NOT_SUPPORTED
        - VALIDATION_ERROR
        - MISSING_FROM
        - MISSING_RECIPIENT
        - TOO_MANY_RECIPIENTS
        - TOO_MANY_TAGS
        - INVALID_DELIVERYTIME
        - DELIVERYTIME_IN_PAST
        - DELIVERYTIME_TOO_FAR
        - INVALID_RECIPIENT_VARIABLES
        - UNKNOWN_IP_POOL
        - UNKNOWN_TEMPLATE
        - TEMPLATE_EXISTS
        - MISSING_MIME
        - MIME_MISSING_FROM
        - MIME_HEADERS_TOO_LARGE
        - DOMAIN_UNVERIFIED
        - SUPPRESSED
        - NO_CONSENT
        - QUOTA_EXCEEDED
        - RATE_LIMITED
        - VALIDATION_RISK
        - INVALID_REQUEST
        - GATE_ERROR
        - ENTITLEMENT_REQUIRED
        - IP_POOL_CHANNEL_MISMATCH
        - UNSUPPORTED_MIME_OPTION
        # A nyers MIME-ban a leiratkozó fejléc nem engedett: a ventMail kezeli (RFC 8058),
        # és egy közös bájtsorban nem tudjuk címzettenként átírni.
        - UNSUPPORTED_MIME_HEADER
        # Consent-köteles csatornán a nyers MIME EGY címzettre küldhető: a one-click token a
