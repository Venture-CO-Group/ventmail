openapi: 3.1.0

info:
  title: ventMail API
  version: 1.0.0
  description: |
    A ventMail publikus küldő felülete — **Mailgun-kompatibilis**.

    A cél, hogy a Mailgun Messages API-ra írt integráció **kódmódosítás nélkül** átjöjjön:
    csak a bázis-URL és a kulcs cserélődik. Ezért követi a `o:` / `h:` / `v:` prefixelt
    paraméterek szemantikáját, beleértve a „elnéző" logikai értékeket (`yes`/`true`/`1`).

    **Stabilitás:** ami ebben a leírásban szerepel, az SZERZŐDÉS. A `/v1` nem kap
    breaking change-et; új mező csak opcionálisként jöhet.

    **Változásnapló (GA előtt).** A `/v1` a GA napján fagy be; addig itt vezetjük, mi
    változott, hogy a korai integrációk ne csendben törjenek el:

    - `o:channel`: a `journey` és a `campaign` érték a publikus API-ról ELTÁVOLÍTVA (a
      Journey/Campaign motor belső csatornái — a sor-prioritás miatt nem választhatók).
    - A `marketing` csatorna mostantól KÉT feltételt kér: `messages:send:marketing` scope
      ÉS a kulcshoz rendelt csatorna-jog (`api_keys.channels`). A meglévő kulcsok
      alapértelmezése `transactional`, tehát új jogot ez a változás nem ad.
      A csatorna CÍMKE marad: azt, hogy valaki marketing tartalmat küld tranzakciósnak
      jelölve, tartalomból nem lehet megállapítani — ott a panasz- és bounce-arány figyelése
      a védelem, nem az API.
    - `POST /v1/messages.mime`: a nem értelmezett `o:` vezérlő mostantól HIBA
      (`UNSUPPORTED_MIME_OPTION`), nem csendes eldobás.
    - **A leiratkozó fejléc a ventMailé** (RFC 8058 one-click). A `h:List-Unsubscribe` a
      strukturált végponton `VALIDATION_ERROR`, a nyers MIME-ban `UNSUPPORTED_MIME_HEADER`.
      Indok: a fejléc a címzett SZEMÉLYÉHEZ kötött, visszavonhatatlan hatású tokent hordoz;
      ha az értéke kívülről jöhetne, nekünk kellene felismernünk, hogy a benne lévő token a
      miénk-e — és ez a felismerés (URL-alak, betűzés, százalék-kódolás) sorra
      megkerülhetőnek bizonyult. A saját preference center linkje a levél TÖRZSÉBE megy.
    - **Consent-köteles csatornán a nyers MIME EGY címzettre küldhető** (`MIME_BULK_MARKETING`).
      A nyers levél egyetlen bájtsor, amit minden címzett ugyanúgy kap meg; egy közös
      leiratkozó tokennel a második címzett leiratkozása az elsőt vinné a suppression-listára.
      Tömeges marketinghez a strukturált végpont vagy a tárolt sablon való — ott a MIME-ot mi
      építjük címzettenként.
    - Ugyanaz az `Idempotency-Key` MÁS kérés-tartalommal `409 IDEMPOTENCY_KEY_REUSED`
      (korábban csendben eldobta a második levelet).
    - **Fenntartott `Idempotency-Key` előtagok** (`campaign:`, `journey:`, `template-test:`,
      `invite:`, `optin:`, `smtp:`, `inbound-fwd-`, `dev-seed-`): a belső küldő utak kulcsai.
      Ilyen kulccsal a kérés `400 IDEMPOTENCY_KEY_RESERVED` — különben egy API-hívó előre
      „lefoglalhatna" egy belső kulcsot, és a valódi levél replay-ként elmaradna.
    - **`<!--vm:…-->` kommentek a törzsben** (v1.1): ezek a Studio szerkesztő feltételes
      blokkjainak belső jelölői. A `/v1` és az SMTP úton beküldött `html`/`text` törzsből a
      jelölő-kommentek kimaradnak, a TARTALOM érintetlen. A szerkesztőből tárolt sablonná
      publikált sablonból a feltételes blokkok a publikáláskor kiesnek.

servers:
  - url: https://api.ventmail.app/v1
    description: éles
  - url: http://localhost:8088/v1
    description: lokális fejlesztés

security:
  - bearerAuth: []
  - basicAuth: []

tags:
  - name: messages
    description: Küldés (strukturált és nyers MIME)
  - name: templates
    description: Tárolt sablonok verziózással
  - name: suppressions
    description: Tiltólista (bounce, panasz, leiratkozás, kézi)

paths:
  /messages:
    post:
      tags: [messages]
      summary: Üzenet küldése
      description: |
        Strukturált küldés. Minden hívás a **PreSendGate** hat kapuján megy át; az elutasítás
        `422`-t ad a gate strukturált kódjával (`error.code`).

        Batch: legfeljebb 1000 címzett hívásonként, `recipient-variables`-szel címzettre
        bontott behelyettesítéssel.

        **Csatolmány** (`attachments`, csak JSON-ban, base64): képek (JPEG, PNG, GIF, WebP) és
        PDF; darabonként ≤ 5 MB, üzenetenként ≤ 10 MB és ≤ 10 darab, batch-ben a csatolmány-bájt
        × címzett ≤ 50 MB. A kódolt kérés teljes mérete ≤ 16 MB. A bájtok titkosítva, csak a
        kiküldésig / az újrapróbálás végéig (legfeljebb a kiküldés + 48 óráig) tárolódnak; az
        üzenet-naplóban csak a típus és a méret marad. A multipart `attachment` / `inline`
        fájlmező továbbra sem támogatott (`400 UNSUPPORTED_ATTACHMENT`).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SendMessageRequest' }
          multipart/form-data:
            schema: { $ref: '#/components/schemas/SendMessageRequest' }
      responses:
        '202':
          description: Elfogadva (sorba állítva vagy elküldve)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SendAccepted' }
        '400':
          description: Formai hiba — a kérés így soha nem lett volna teljesíthető
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Hiányzó vagy érvénytelen API-kulcs
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: A kulcshoz hiányzik a `messages:send` scope
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: A PreSendGate elutasította (a `error.code` a gate strukturált oka)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: |
            Az `Idempotency-Key` már használt MÁS kérés-tartalommal. A második levél NEM ment ki.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: Rate-limit

  /messages.mime:
    post:
      tags: [messages]
      summary: Nyers MIME küldése
      description: |
        A kész MIME-levél továbbítása `multipart/form-data`-ként (a `message` mezőben).
        A fejlécek megőrizve; a `to` felülírhatja a MIME `To:` fejlécét (boríték-címzett).

        A gate itt is megkerülhetetlen.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [message]
              properties:
                message:
                  type: string
                  format: binary
                  description: A nyers MIME-levél
                to:
                  type: string
                  description: Boríték-címzett(ek), vesszővel elválasztva
      responses:
        '202':
          description: Elfogadva
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SendAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Rejected' }

  /templates:
    get:
      tags: [templates]
      summary: Tárolt sablonok listája
      responses:
        '200':
          description: A sablonok és verzióik
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Template' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [templates]
      summary: Sablon létrehozása
      description: Az első verzió azonnal aktív lesz — különben a `template=` küldés némán elbukna.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, template]
              properties:
                name:
                  type: string
                  maxLength: 128
                  pattern: '^[a-z0-9][a-z0-9._-]*$'
                description: { type: string, maxLength: 255 }
                template: { type: string, description: 'HTML törzs `{{ változó }}` merge-tagekkel' }
                text: { type: string, description: 'Plaintext változat' }
      responses:
        '201':
          description: Létrejött
          content:
            application/json:
              schema:
                type: object
                properties:
                  template:
                    type: object
                    properties:
                      name: { type: string }
                      version: { type: integer }
                      active: { type: boolean }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /templates/{name}/versions:
    post:
      tags: [templates]
      summary: Új sablon-verzió
      description: |
        A verziók MEGVÁLTOZTATHATATLANOK: ami egyszer kimehetett egy levélben, azt utólag
        nem írjuk át. Módosítás = új verzió; az `active` dönti el, hogy azonnal éles legyen.
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [template]
              properties:
                template: { type: string }
                text: { type: string }
                active: { type: boolean, default: false }
      responses:
        '201':
          description: A verzió létrejött
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    type: object
                    properties:
                      version: { type: integer }
                      active: { type: boolean }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /events:
    get:
      summary: Események lekérdezése (kurzoros lapozással)
      description: |
        A Mailgun events API paritása. A LAPOZÁS KURZOROS, és ez nem stílus kérdése: az
        eseménytábla folyamatosan nő, tehát offset-lapozásnál a második oldal lekérésekor a
        sorok elcsúsznak — a hívó ugyanazt az eseményt kétszer kapja meg, vagy sosem látja.
        Egy suppression-szinkron ebből csendben rossz adatot építene.

        A kurzor az `(occurred_at, id)` páros: az `occurred_at` önmagában nem egyedi, egy
        batch ezer eseménye ugyanabban a másodpercben keletkezik.
      operationId: listEvents
      security: [{ bearerAuth: [] }, { basicAuth: [] }]
      parameters:
        - { name: type, in: query, schema: { type: string }, description: 'esemény-típus (többször is megadható)' }
        - { name: recipient, in: query, schema: { type: string } }
        - { name: channel, in: query, schema: { type: string, enum: [transactional, marketing] } }
        - { name: message_id, in: query, schema: { type: string } }
        - { name: tag, in: query, schema: { type: string } }
        - { name: since, in: query, schema: { type: string, format: date-time } }
        - { name: until, in: query, schema: { type: string, format: date-time } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 300, default: 100 } }
        - { name: cursor, in: query, schema: { type: string }, description: 'az előző válasz `paging.next` értéke' }
      responses:
        '200':
          description: Események
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Event' } }
                  paging:
                    type: object
                    properties:
                      next: { type: [string, 'null'], description: 'a következő oldal kurzora' }
        '401':
          description: Hiányzó vagy érvénytelen API-kulcs
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /webhooks/deliveries:
    get:
      summary: Webhook-kézbesítések (a dead-letter sorral együtt)
      operationId: listWebhookDeliveries
      security: [{ bearerAuth: [] }, { basicAuth: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [pending, delivered, failed, dead_letter] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: Kézbesítések
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/WebhookDelivery' } }
        '401':
          description: Hiányzó vagy érvénytelen API-kulcs
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /webhooks/deliveries/{uuid}/replay:
    post:
      summary: Egy kézbesítés újrajátszása a dead-letter sorból
      description: |
        A dead-letter sor csak akkor ér valamit, ha van belőle kivezető út: az ügyfél
        megjavítja a végpontot, és újraküldeti, ami nem jutott el. A sikeres replay
        `delivered`-re állítja a sort, tehát a lista magától ürül.
      operationId: replayWebhookDelivery
      security: [{ bearerAuth: [] }, { basicAuth: [] }]
      parameters:
        - { name: uuid, in: path, required: true, schema: { type: string } }
      responses:
        '202':
          description: Sorba téve
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  status: { type: string, enum: [queued] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /webhooks/endpoints:
    get:
      tags: [webhooks]
      summary: A webhook-végpontok listája
      operationId: listWebhookEndpoints
      security: [{ bearerAuth: [] }, { basicAuth: [] }]
      responses:
        '200':
          description: A végpontok
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/WebhookEndpoint' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [webhooks]
      summary: Webhook-végpont létrehozása
      description: |
        A titok EGYSZER, ebben a válaszban látszik — utána már csak az aláírásunkban él.
        Az URL-nek `https`-nek kell lennie, és publikus címre kell mutatnia: a belső háló,
        a loopback és a felhő-metadata tartománya tiltott (`INVALID_WEBHOOK_URL`).
      operationId: createWebhookEndpoint
      security: [{ bearerAuth: [] }, { basicAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, url]
              properties:
                name: { type: string, maxLength: 120 }
                url: { type: string, maxLength: 2048 }
                events:
                  type: array
                  description: Üres vagy hiányzó lista = MINDEN esemény.
                  items: { $ref: '#/components/schemas/EventType' }
                redact_recipient:
                  type: boolean
                  default: false
                  description: '`true`: a nyers címzett-cím nem megy ki (`message.recipient = null`), csak a maszkolt alak.'
      responses:
        '201':
          description: Létrehozva — a titokkal együtt
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/WebhookEndpoint' }
                  - type: object
                    properties:
                      secret: { type: string, description: 'Csak MOST látszik.' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /webhooks/endpoints/{uuid}:
    patch:
      tags: [webhooks]
      summary: Webhook-végpont módosítása
      operationId: updateWebhookEndpoint
      security: [{ bearerAuth: [] }, { basicAuth: [] }]
      parameters:
        - { name: uuid, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 120 }
                url: { type: string, maxLength: 2048 }
                events: { type: array, items: { $ref: '#/components/schemas/EventType' } }
                active: { type: boolean }
                redact_recipient: { type: boolean }
      responses:
        '200':
          description: Módosítva
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookEndpoint' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [webhooks]
      summary: Webhook-végpont törlése
      operationId: deleteWebhookEndpoint
      security: [{ bearerAuth: [] }, { basicAuth: [] }]
      parameters:
        - { name: uuid, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Törölve }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /webhooks/endpoints/{uuid}/rotate-secret:
    post:
      tags: [webhooks]
      summary: A végpont aláíró titkának cseréje
      description: |
        A RÉGI titok AZONNAL érvénytelen — nincs átfedési ablak. A rotációt jellemzően
        szivárgás váltja ki, olyankor pedig a „még pár percig érvényes" a támadónak kedvez.
      operationId: rotateWebhookEndpointSecret
      security: [{ bearerAuth: [] }, { basicAuth: [] }]
      parameters:
        - { name: uuid, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Az ÚJ titok — csak most látszik
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/WebhookEndpoint' }
                  - type: object
                    properties:
                      secret: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /suppressions:
    get:
      tags: [suppressions]
      summary: Tiltólista lekérdezése (külön listák, kurzoros lapozással)
      description: |
        A `list` a felület négy listája: `bounces` (bounce + fogadó-oldali tiltás),
        `complaints`, `unsubscribes`, `manual` (kézi + platform-szabály). A platform-szintű
        tiltások nem jelennek meg (a létezésük sem derül ki).
      operationId: listSuppressions
      security: [{ bearerAuth: [] }, { basicAuth: [] }]
      parameters:
        - { name: list, in: query, schema: { type: string, enum: [bounces, complaints, unsubscribes, manual] } }
        - { name: search, in: query, schema: { type: string, maxLength: 320 }, description: 'címrészlet' }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 100 } }
        - { name: cursor, in: query, schema: { type: string }, description: 'az előző válasz `paging.next` értéke' }
      responses:
        '200':
          description: Tiltások
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Suppression' } }
                  paging:
                    type: object
                    properties:
                      next: { type: [string, 'null'] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [suppressions]
      summary: Cím felvétele a tiltólistára
      description: |
        Monoton: a szélesebb hatókör marad meg, és a panasz/leiratkozás RAGADÓS — más ok nem
        írja felül (különben törölhetővé válna). Egyébként a súlyosabb ok marad. A válasz
        minden címre ugyanaz (201): a platform-szintű tiltás létezése nem derül ki.
      operationId: addSuppression
      security: [{ bearerAuth: [] }, { basicAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email, maxLength: 320 }
                reason: { type: string, enum: [manual, bounce, blocked, unsubscribe, complaint], default: manual }
                applies_to: { type: string, enum: [all, marketing], default: all }
      responses:
        '201':
          description: Felvéve (vagy a meglévő tiltás szigorítva)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Suppression' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /suppressions/{email}:
    delete:
      tags: [suppressions]
      summary: Tiltás törlése indoklással
      description: |
        Az INDOKLÁS (`reason`) kötelező — JSON-törzsben vagy query-paraméterként —, és a
        törlés auditált. A PANASZ és a LEIRATKOZÁS nem törölhető (`403
        SUPPRESSION_IRREVOCABLE`): az az érintett akarata. Csak a workspace saját sora
        törölhető; a nem létező (vagy platform-szintű) címre `404 UNKNOWN_SUPPRESSION`.
      operationId: deleteSuppression
      security: [{ bearerAuth: [] }, { basicAuth: [] }]
      parameters:
        - { name: email, in: path, required: true, schema: { type: string } }
        - { name: reason, in: query, required: false, schema: { type: string, minLength: 3, maxLength: 500 }, description: 'a törzs `reason` mezőjének alternatívája' }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 3, maxLength: 500, description: 'a törlés indoklása (auditálva)' }
      responses:
        '204': { description: Törölve }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Hiányzó scope, vagy nem törölhető tiltás (`SUPPRESSION_IRREVOCABLE`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }

  /validate:
    post:
      tags: [validation]
      summary: Egy cím ellenőrzése (szinkron)
      description: |
        NYOLC ellenőrzés: szintaxis · domain+MX · szerepcím · eldobható domain · catch-all ·
        elgépelés-javaslat · kockázati pontszám · minősítés.

        A `result` az a NÉGY szó, amit a felületen mutatni kell; a `risk` a folytonos
        pontszám, amivel a küldési kapu dönt. Az `unknown` nem hiba: a catch-all szerver és a
        greylisting mögött nincs igazság, amit ki lehetne deríteni — és a hamis bizonyosság
        rosszabb, mint a bevallott bizonytalanság.
      operationId: validateAddress
      security: [{ bearerAuth: [] }, { basicAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [address]
              properties:
                address: { type: string, maxLength: 320 }
      responses:
        '200':
          description: Az eredmény
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationVerdict' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /validate/bulk:
    post:
      tags: [validation]
      summary: Címlista ellenőrzése (aszinkron)
      description: |
        CSV-fájl vagy címtömb. A feldolgozás DARABOKBAN megy: a szonda per-domain kerete
        percenként töltődik, tehát a folyamatos futás úgyis abba ütközne — a lassítás itt
        FUNKCIÓ, nem korlát.
      operationId: validateBulk
      security: [{ bearerAuth: [] }, { basicAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 120 }
                addresses: { type: array, items: { type: string, maxLength: 320 } }
          multipart/form-data:
            schema:
              type: object
              properties:
                name: { type: string }
                file: { type: string, format: binary, description: 'CSV — az első oszlop a cím' }
      responses:
        '202':
          description: Sorba téve
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationJob' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /validate/bulk/{uuid}:
    get:
      tags: [validation]
      summary: Egy bulk futás állapota
      operationId: showValidationJob
      security: [{ bearerAuth: [] }, { basicAuth: [] }]
      parameters:
        - { name: uuid, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Az állapot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationJob' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /validate/bulk/{uuid}/export:
    get:
      tags: [validation]
      summary: A bulk futás eredménye CSV-ben
      operationId: exportValidationJob
      security: [{ bearerAuth: [] }, { basicAuth: [] }]
      parameters:
        - { name: uuid, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: CSV
          content:
            text/csv:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /routes:
    get:
      tags: [inbound]
      summary: A bejövő route-szabályok listája
      operationId: listInboundRoutes
      security: [{ bearerAuth: [] }, { basicAuth: [] }]
      responses:
        '200':
          description: A szabályok, prioritás szerint
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/InboundRoute' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [inbound]
      summary: Route-szabály létrehozása
      description: |
        A szabályok PRIORITÁS szerint értékelődnek ki, azonos prioritásnál a létrehozás
        sorrendjében. Az első `stop()` akció lezárja a láncot.

        A kifejezést MENTÉSKOR is ellenőrizzük — az elgépelt regex azonnal hibát ad, nem
        három nap múlva abból, hogy „nem jön a levél".
      operationId: createInboundRoute
      security: [{ bearerAuth: [] }, { basicAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InboundRouteInput' }
      responses:
        '201':
          description: |
            Létrehozva — az ALÁÍRÓ TITOKKAL együtt. A titok csak MOST látszik; a
            `forward(url)` ezzel írja alá a POST-ot, és a fogadó ezzel ellenőrzi.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/InboundRoute' }
                  - type: object
                    properties:
                      signing_secret: { type: string, description: 'Csak MOST látszik.' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /routes/{uuid}:
    patch:
      tags: [inbound]
      summary: Route-szabály módosítása
      operationId: updateInboundRoute
      security: [{ bearerAuth: [] }, { basicAuth: [] }]
      parameters:
        - { name: uuid, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InboundRouteInput' }
      responses:
        '200':
          description: Módosítva
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InboundRoute' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [inbound]
      summary: Route-szabály törlése
      operationId: deleteInboundRoute
      security: [{ bearerAuth: [] }, { basicAuth: [] }]
      parameters:
        - { name: uuid, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Törölve }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /routes/{uuid}/rotate-secret:
    post:
      tags: [inbound]
      summary: A route `forward(url)` aláíró titkának cseréje
      description: |
        A RÉGI titok AZONNAL érvénytelen. A titok a szabály létrehozásakor egyszer látszik;
        ha elveszett, itt lehet újat kérni.
      operationId: rotateInboundRouteSecret
      security: [{ bearerAuth: [] }, { basicAuth: [] }]
      parameters:
        - { name: uuid, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Az ÚJ titok — csak most látszik
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/InboundRoute' }
                  - type: object
                    properties:
                      signing_secret: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /inbound/messages:
    get:
      tags: [inbound]
      summary: A tárolt bejövő levelek
      description: |
        A `store()` akcióval eltett levelek. A RETENCIÓ rövid (alap 3 nap): a bejövő levél
        idegen tartalom, amit nem mi írtunk és nem a mi jogalapunkon tárolunk. A lejárat
        utáni 404 nem hiba, hanem a megígért adatminimalizálás.
      operationId: listInboundMessages
      security: [{ bearerAuth: [] }, { basicAuth: [] }]
      parameters:
        - { name: recipient, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [received, parsed, routed, failed, forward_failed] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: A levelek
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/InboundMessageSummary' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /inbound/messages/{uuid}:
    get:
      tags: [inbound]
      summary: Egy bejövő levél — ugyanaz a payload, amit a forward(url) POSTol
      operationId: showInboundMessage
      security: [{ bearerAuth: [] }, { basicAuth: [] }]
      parameters:
        - { name: uuid, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: A levél
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InboundMessage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /inbound/messages/{uuid}/raw:
    get:
      tags: [inbound]
      summary: A nyers MIME
      operationId: showInboundMessageRaw
      security: [{ bearerAuth: [] }, { basicAuth: [] }]
      parameters:
        - { name: uuid, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: A nyers levél
          content:
            message/rfc822:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /inbound/messages/{uuid}/attachments/{attachmentUuid}:
    get:
      tags: [inbound]
      summary: Csatolmány-letöltés lejáró, aláírt URL-lel
      description: |
        A FERTŐZÖTT csatolmányra NEM adunk linket (409). Nem a mi dolgunk kártevőt
        terjeszteni, még kérésre sem — az eredmény a `scan` mezőből olvasható.
      operationId: showInboundAttachment
      security: [{ bearerAuth: [] }, { basicAuth: [] }]
      parameters:
        - { name: uuid, in: path, required: true, schema: { type: string } }
        - { name: attachmentUuid, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: A letöltési link
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: { type: string }
                  content_type: { type: string }
                  size: { type: integer }
                  url: { type: string, description: 'lejáró, aláírt URL' }
                  expires_in: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: A csatolmány nem tölthető le (szkennelési eredmény)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /journeys/events:
    post:
      tags: [journeys]
      summary: API-esemény küldése egy journey-triggerhez
      description: |
        A `api_event` triggerű Customer Journey-k indítása egy külső rendszer eseményéből
        (elhagyott kosár, előfizetés-lejárat, CRM-állapotváltás).

        **Az `Idempotency-Key` kötelező** (golden rule 5): egy újrapróbált integráció-hívás
        különben MÁSODIK journey-futást indítana ugyanarra az emberre, tehát a címzett két
        párhuzamos levélsorozatot kapna. A `journey_runs` részleges egyedi indexe csak az
        AKTÍV futást védi — egy már befejezett journey-be az ismételt hívás újra beléptetne.

        **A `data` KORLÁTOS és csak skalár.** A payload a futás kontextusába kerül, ahol a
        `condition` lépés szűrhet rá — de ott nincs séma, és a mező a törlési kérés meg a
        retenció tárgya is. Legfeljebb 20 kulcs, értékenként 500 karakter, beágyazott
        objektum nélkül. Aki több adatot akar a döntéshez, szegmenst használ: az a
        kontakt-rekordból dolgozik, ami a GDPR-törlés útján amúgy is anonimizálódik.

        **A válasz nem mondja meg, létezik-e a cím a közönségben.** A `started` a nálunk
        indult futásokat számolja. Egy „ez a cím nincs a listán" válasz cím-létezés-
        orákulummá tenné a végpontot.
      operationId: createJourneyEvent
      security: [{ bearerAuth: [] }, { basicAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JourneyEventInput' }
      responses:
        '202':
          description: |
            Elfogadva. A `started` az elindult journey-futások száma — nulla is lehet
            (nincs ilyen triggerű aktív journey, nincs consent, vagy a címzett már fut).
          content:
            application/json:
              schema:
                type: object
                properties:
                  accepted: { type: boolean, example: true }
                  started: { type: integer, example: 1 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /analytics/campaigns/{uuid}:
    get:
      tags: [analytics]
      summary: Kampány-riport (összesítő, variánsok, napi idősor, klikk-térkép)
      description: |
        A marketing analitika és a platform-napló UGYANARRA az esemény-forrásra épül
        (`message_events`, a kampány tagjén keresztül) — ugyanaz a kampány ugyanazt a
        `delivered` számot adja mindkét felületen. A kampány saját számlálói
        (`sent_count`, `failed_count`) SZÁNDÉKOSAN nem forrás: azok a küldési folyamat
        állapotát írják le, nem a fogadó visszajelzését.

        **A ráták nevezői kimondva:** a nyitás, a klikk, a panasz és a leiratkozás a
        KÉZBESÍTETT-re vetül (aki nem kapta meg, nem is nyithatta meg); a bounce az
        ELFOGADOTT-ra (a bounce épp a kézbesítés kudarca, a kézbesítettre osztva mindig
        szebb számot adna); a CTOR az EGYEDI NYITÓK-ra. A nyitás és a klikk EGYEDI
        címzettben számol — egy Apple MPP-s postafiók ugyanazt a levelet tízszer
        „megnyitja".

        **A nyitás mérése 2021 óta megbízhatatlan** (Apple Mail Privacy Protection: a proxy
        minden levelet letölt). A számot kiszámoljuk, mert a trendje használható, de nem
        hazudjuk pontosnak — döntéshez a klikk a mérőszám.

        **A válasz aggregált: egyetlen címzett-címet sem tartalmaz.** Címzett-szintű adat
        csak az érintetti exporton (auditált, egy emberre szóló út) érhető el.

        `?format=csv` ugyanezeket a számokat adja fájlként — nem külön lekérdezés.
      operationId: getCampaignReport
      security: [{ bearerAuth: [] }, { basicAuth: [] }]
      parameters:
        - name: uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: format
          in: query
          required: false
          schema: { type: string, enum: [json, csv], default: json }
          description: A `csv` letölthető fájlt ad; a `section` dönti el, melyiket.
        - name: section
          in: query
          required: false
          schema: { type: string, enum: [summary, variants, clicks], default: summary }
          description: |
            CSAK `format=csv` mellett. `summary` az összesítő egy sorban, `variants` az A/B
            variánsok soronként, `clicks` a klikk-térkép rangsorban. Ismeretlen érték 404 —
            nem csendes visszaesés az összesítőre.
      responses:
        '200':
          description: A kampány riportja
          content:
            application/json:
              schema:
                type: object
                properties:
                  summary: { $ref: '#/components/schemas/CampaignReportSummary' }
                  variants:
                    type: array
                    items: { $ref: '#/components/schemas/CampaignReportVariant' }
                  daily:
                    type: array
                    items:
                      type: object
                      description: |
                        ESEMÉNY-számok, nem egyediek: a Timescale folytonos aggregátum nem
                        támogat `DISTINCT`-et, és a napi „hányan" amúgy sem összegezhető
                        (aki két napon nyit, két napba tartozik, de egy ember).
                      properties:
                        day: { type: string, format: date }
                        delivered: { type: integer }
                        opened: { type: integer }
                        clicked: { type: integer }
                  click_map:
                    type: array
                    items: { $ref: '#/components/schemas/ClickMapEntry' }
            text/csv:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

x-webhook-signature:
  description: |
    Minden webhook-kérés aláírt. Fejlécek:
    `X-VentMail-Timestamp` (unix mp), `X-VentMail-Signature` = hex(HMAC-SHA256(titok, timestamp + "." + nyers törzs)),
    `X-VentMail-Signature-Previous` (csak titok-rotáció türelmi ablakában, a régi titokkal),
    `X-VentMail-Event` (eseménytípus), `X-VentMail-Event-Id` (az esemény stabil id-je = payload `id`),
    `X-VentMail-Delivery` (a kézbesítés id-je, végpontonként), `X-VentMail-Test: 1` (csak teszt-eseményen).
    A titok a nyers `whsec_…` string UTF-8 bájtjai (nem dekódolandó). Az aláírt adat a NYERS
    kérés-törzs bájtjai — a JSON-t NE dekódold és kódold újra ellenőrzés előtt.
    Fogadó oldalon: (1) időben állandó összehasonlítás; (2) elutasítás, ha az időbélyeg
    300 mp-nél régebbi vagy 60 mp-nél jövőbelibb; (3) a már látott esemény eldobása (2xx-szel) —
    a dedup kulcsa az ALÁÍRT törzs `id` mezője. A fejlécek (`X-VentMail-Event-Id`,
    `X-VentMail-Delivery`) NINCSENEK aláírva, csak kényelmi célúak; replay-védelemre ne használd őket. Bármely 2xx = sikeres kézbesítés; más válasz / időtúllépés (10 mp) →
    újrapróbálás 1, 2, 4, 8, 16 perc után (összesen 6 kísérlet), utána dead-letter (replay-elhető).
  algorithm: HMAC-SHA256
  signed_payload: '{timestamp}.{raw_body}'
  encoding: hex (lowercase)
  tolerance_seconds: 300
  future_tolerance_seconds: 60
  kat:
    - name: minimal
      secret: 'whsec_teszt'
      timestamp: 1756800000
      body: '{"event":"delivered"}'
      signature: '363c17654baea444d069d95204c10390972dda1d4118ed255c6d23537ec1fe24'
    - name: bounced-hard-redacted
      secret: 'whsec_kat_test_secret_do_not_use'
      timestamp: 1763460000
      body: '{"id":"0193f2a4-6f1e-7c3a-9d2b-5e8f1a2b3c4d","event":"bounced","timestamp":1763460000,"message":{"id":"0193f2a0-1111-7aaa-8bbb-123456789abc","recipient":null,"recipient_masked":"a***@example.com","channel":"transactional","tags":["delivery"]},"reason":"hard","variables":[],"delivery":{"code":550,"enhanced_code":"5.1.1","classification":"hard","bounce_type":"hard"}}'
      signature: 'c3cd335fffdc8fd94835d95dd009edd462510d8dd985e6cc22659487d078742a'
    - name: failed-unicode
      secret: 'whsec_kat_test_secret_do_not_use'
      timestamp: 1763460100
      body: '{"id":"0193f2a5-0000-7000-8000-000000000003","event":"failed","timestamp":1763460100,"message":{"id":"0193f2a0-2222-7aaa-8bbb-123456789abc","recipient":null,"recipient_masked":"z***@pelda.hu","channel":"transactional","tags":["számla/2026"]},"reason":"soft","variables":{"order":"Ő-42"},"delivery":{"code":451,"enhanced_code":"4.4.1","classification":"soft","bounce_type":null}}'
      signature: '5f6232948accfdb88dff6973ac60e0772ad5fb9ec20b4e3625792e84bf39c854'

webhooks:
  deliveryEvent:
    post:
      tags: [webhooks]
      summary: Kézbesítési esemény a workspace webhook-végpontjára
      description: |
        A ventMail HÍVJA a végpontot (a `POST /v1/webhooks/endpoints`-szal regisztrált https URL-t).
        Aláírás és ellenőrzés: `x-webhook-signature` (KAT-vektorokkal).
      operationId: deliveryEventWebhook
      parameters:
        - { name: X-VentMail-Timestamp, in: header, required: true, schema: { type: string } }
        - { name: X-VentMail-Signature, in: header, required: true, schema: { type: string } }
        - { name: X-VentMail-Signature-Previous, in: header, required: false, schema: { type: string } }
        - { name: X-VentMail-Event, in: header, required: true, schema: { $ref: '#/components/schemas/EventType' } }
        - { name: X-VentMail-Event-Id, in: header, required: false, description: 'NEM aláírt kényelmi fejléc (= törzs `id`); a funkció előtt rögzített kézbesítésen hiányzik', schema: { type: string, format: uuid } }
        - { name: X-VentMail-Delivery, in: header, required: true, schema: { type: string, format: uuid } }
        - { name: X-VentMail-Test, in: header, required: false, schema: { type: string, enum: ['1'] } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebhookPayload' }
      responses:
        '2XX': { description: 'Átvéve (a duplikátum is 2xx-et kapjon)' }
        default: { description: 'Újrapróbálás exponenciális visszalépéssel; 6 kísérlet után dead-letter' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'A ventMail API-kulcs: `Authorization: Bearer vm_live_…`'
    basicAuth:
      type: http
      scheme: basic
      description: 'Mailgun-paritás: `api` felhasználónév + az API-kulcs jelszóként.'

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, maxLength: 255 }
      description: |
        **Kötelező** minden küldő POST-on. Ugyanaz a kulcs ugyanazt a választ adja, és NEM
        küld újra — enélkül egy megismételt hálózati kérés duplán kézbesítene.

  responses:
    BadRequest:
      description: Formai hiba
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Hiányzó vagy érvénytelen API-kulcs
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Hiányzó scope
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Rejected:
      description: A PreSendGate elutasította
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Nincs ilyen erőforrás ebben a workspace-ben
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Suppression:
      type: object
      properties:
        id: { type: string }
        email: { type: string }
        reason: { type: string, enum: [manual, unsubscribe, bounce, blocked, complaint, policy] }
        applies_to: { type: string, enum: [all, marketing] }
        source: { type: string }
        detail: { type: [string, 'null'], description: 'kiegészítő ok, pl. bounce-nál `hard` / `soft`' }
        deletable: { type: boolean, description: 'a panasz és a leiratkozás nem törölhető' }
        expires_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
    CampaignReportCounts:
      type: object
      description: |
        A SZÁMOK és a RÁTÁK — közös alak az összesítőben és a variáns-bontásban. A `total`
        és az `unique` KÜLÖN mező, mert mást mondanak: az `opened` az események száma, az
        `unique_opened` az egyedi címzettek száma.

        A számok CÍMZETTET számolnak, nem eseményt (az `opened`/`clicked` kivételével): az
        éles driver-úton egy címzettre kétszer is keletkezhet `accepted`, és a
        `bounced / accepted` ráta így felére kozmetikázódott volna — az pedig a
        kézbesíthetőségi megfelelés száma.
      properties:
        rejected:
          type: integer
          description: |
            A PreSendGate által elutasított CÍMZETTEK száma (suppression, hiányzó consent,
            kvóta, címellenőrzési kockázat). Enélkül a `recipients` és az `accepted`
            különbsége magyarázat nélkül állna, és a tenant nem látná, hogy a listája egy
            része ki sem ment — a listahigiénia romlása a kézbesíthetőségi probléma első jele.
        accepted: { type: integer }
        delivered: { type: integer }
        deferred: { type: integer }
        bounced: { type: integer }
        complained: { type: integer }
        unsubscribed: { type: integer }
        opened: { type: integer, description: 'Esemény-szám (MPP-vel felfelé torzít).' }
        unique_opened: { type: integer, description: 'Egyedi címzett.' }
        clicked: { type: integer }
        unique_clicked: { type: integer }
        engaged:
          type: integer
          description: |
            Az ELÉRT közönség: aki nyitott VAGY kattintott. Ez a CTOR nevezője —
            kép-blokkoló kliensben a pixel nem tölt be, a link viszont kattintható, tehát
            több kattintó lehet, mint nyitó, és a kattintás bizonyítja a megnyitást.
        open_rate: { type: number, format: float, description: 'unique_opened / delivered' }
        click_rate: { type: number, format: float, description: 'unique_clicked / delivered' }
        click_to_open_rate: { type: number, format: float, description: 'unique_clicked / engaged' }
        bounce_rate: { type: number, format: float, description: 'bounced / accepted' }
        complaint_rate: { type: number, format: float, description: 'complained / delivered' }
        unsubscribe_rate: { type: number, format: float, description: 'unsubscribed / delivered' }
        rejection_rate: { type: number, format: float, description: 'rejected / (rejected + accepted)' }

    CampaignReportSummary:
      type: object
      description: A kampány azonosítói és a számai — minden szám a marketing-ténytáblából.
      allOf:
        - type: object
          properties:
            campaign: { type: string }
            campaign_uuid: { type: string, format: uuid }
            status: { type: string }
            recipients:
              type: integer
              description: A materializált címzett-halmaz mérete (a célzásból, nem eseményből).
        - $ref: '#/components/schemas/CampaignReportCounts'

    CampaignReportVariant:
      type: object
      description: |
        Egy A/B variáns riportja. A számok és a ráták UGYANAZOK a mezők, mint az
        összesítőben, de a variáns AZONOSÍTÓI mások — a variáns nem kampány, tehát nincs
        `campaign_uuid`-ja és `recipients` száma.
      allOf:
        - type: object
          properties:
            label: { type: string, example: A }
            subject: { type: string, nullable: true }
            weight: { type: integer, description: 'Egész százalék; az összegnek 100-nak kell lennie.' }
            is_winner: { type: boolean }
        - $ref: '#/components/schemas/CampaignReportCounts'

    ClickMapEntry:
      type: object
      description: |
        RANGSOR: a legtöbbet kattintott link az első. A `(egyéb link)` sor a linkenkénti
        felső korlát fölötti kattintásokat gyűjti — a csonkítás ténye látszik, nem csendes.
      properties:
        url: { type: string }
        clicks: { type: integer, description: 'Összes kattintás.' }
        unique_clicks: { type: integer, description: 'Egyedi kattintó (pszeudonim hash alapján).' }
        first_clicked_at: { type: string, format: date-time, nullable: true }
        last_clicked_at: { type: string, format: date-time, nullable: true }

    JourneyEventInput:
      type: object
      required: [email, event]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
          description: A címzett. A journey-be lépés a consent- és suppression-kapukon múlik.
        event:
          type: string
          maxLength: 100
          pattern: '^[A-Za-z0-9_.:-]+$'
          example: checkout_abandoned
          description: Az esemény neve — a journey trigger-configja ehhez illeszkedik.
        data:
          type: object
          maxProperties: 20
          additionalProperties: { type: string, maxLength: 500 }
          description: |
            Legfeljebb 20 SKALÁR kulcs. A futás kontextusába kerül, ahol a `condition`
            lépés `context_equals`-szel szűrhet rá. Beágyazott objektum nincs: az korlátlan
            mélységű személyes adatot hordozna egy séma nélküli mezőbe.
          example: { cart_total: '149000' }

    SendMessageRequest:
      type: object
      required: [from, to]
      properties:
        from:
          type: string
          description: '`Név <cim@domain>` vagy `cim@domain`. A domainnek hitelesítettnek kell lennie.'
        to:
          oneOf:
            - type: string
            - type: array
              items: { type: string }
              maxItems: 1000
          description: 'Címzett(ek). Batch esetén legfeljebb 1000.'
        subject: { type: string }
        html: { type: string }
        text: { type: string }
        template:
          type: string
          description: 'Tárolt sablon neve; a `v:*` változókkal helyettesítődik be.'
        t:variables:
          type: string
          description: |
            JSON objektum (skalár értékekkel), CSAK a sablon rendereléséhez — titkos linkek,
            kódok. A `v:*`-gal ellentétben NEM visszhangzik: nem kerül eseménybe, webhookba
            vagy API-válaszba, titkosítva várja a küldést, és a küldés végén törlődik.
            Azonos kulcsnál felülírja a `v:*` értéket.
        recipient-variables:
          type: string
          description: |
            JSON: címzett → változók. Minden címzett a SAJÁT behelyettesítését kapja
            (`%recipient.kulcs%`, `%recipient_email%`).
        o:deliverytime:
          type: string
          description: 'RFC 2822 időpont. Nem lehet a múltban, és legfeljebb 7 nappal előre.'
        o:testmode:
          type: string
          description: 'Ha igaz, naplóz, de nem küld.'
        o:tag:
          type: array
          items: { type: string }
          maxItems: 3
          description: 'Legfeljebb 3 tag üzenetenként.'
        attachments:
          type: array
          maxItems: 10
          description: |
            Kimenő csatolmányok (csak `application/json` kérésben). Ellenőrzés: típus-allowlist,
            a deklarált `content_type` és a tartalom mágikus bájtjainak egyezése
            (`ATTACHMENT_TYPE_MISMATCH`), darabonkénti / összesített / batch-méretkorlát
            (`ATTACHMENT_TOO_LARGE`), darabszám (`TOO_MANY_ATTACHMENTS`). A fájlnév tisztítva megy
            ki (útvonal, vezérlő- és irányjelző karakterek nélkül, ≤ 100 karakter, a tartalomhoz
            illő kiterjesztéssel). Az idempotencia-lenyomat a csatolmányt is fedi: ugyanaz a
            kulcs más csatolmánnyal `409`.
          items: { $ref: '#/components/schemas/OutboundAttachment' }
        o:tracking: { type: string }
        o:tracking-clicks: { type: string, enum: ['yes', 'no', 'htmlonly'] }
        o:tracking-opens: { type: string }
        o:dkim: { type: string }
        o:require-tls: { type: string }
        o:sending-ip-pool: { type: string }
        o:channel:
          type: string
          enum: [transactional, marketing]
          default: transactional
          description: |
            A `transactional` az EGYETLEN consent-mentes csatorna, és ez az alapértelmezés.

            A `marketing` **külön scope-ot igényel** (`messages:send:marketing`), és
            megerősített (double opt-in) consentet a címzettre — enélkül `403
            CHANNEL_NOT_ALLOWED`, illetve `422 NO_CONSENT`.

            A `journey` és a `campaign` a Journey/Campaign motor BELSŐ csatornái (sor-prioritás
            miatt), a publikus API-ról nem választhatók.
      additionalProperties:
        description: '`h:X-*` egyedi fejlécek és `v:*` változók.'

    OutboundAttachment:
      type: object
      required: [filename, content]
      properties:
        filename:
          type: string
          description: 'A megjelenő fájlnév (UTF-8). Tisztítva megy ki; ha a kiterjesztés nem illik a tartalomhoz, a helyes hozzáfűződik.'
          example: jersey-magic.jpg
        content_type:
          type: string
          enum: [image/jpeg, image/png, image/gif, image/webp, application/pdf]
          description: 'Elhagyható: ekkor a tartalomból állapítjuk meg. Az `image/jpg` alias elfogadott.'
        content:
          type: string
          format: byte
          description: 'A fájl base64-kódolva (sortörés megengedett). Dekódolva darabonként ≤ 5 MB.'
      example:
        filename: jersey-magic.jpg
        content_type: image/jpeg
        content: /9j/4AAQSkZJRgABAQAAAQABAAD...

    SendAccepted:
      type: object
      properties:
        id: { type: string, format: uuid, description: 'Az üzenet azonosítója (trace-hez).' }
        message: { type: string, example: 'Queued. Thank you.' }
        status:
          type: string
          enum: [accepted, scheduled, sending, sent, delivered, deferred]

    Template:
      type: object
      properties:
        name: { type: string }
        description: { type: string, nullable: true }
        versions:
          type: array
          items: { type: integer }
        active_version: { type: integer, nullable: true }

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { $ref: '#/components/schemas/ErrorCode' }
            message: { type: string, description: 'Emberi magyarázat. A KÓD a szerződés, ez segítség.' }
            details: { type: object, additionalProperties: true }

    Event:
      type: object
      properties:
        # UUID, nem sorszám: a belső `id` tenant-független szekvencia, amiből két hívásból
        # (09:00 → 10:00) bárki megbecsülné a platform teljes esemény-volumenét.
        id: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/EventType' }
        message_id: { type: string }
        recipient: { type: [string, 'null'] }
        channel: { type: string }
        reason: { type: [string, 'null'], description: 'a gate strukturált oka vagy a bounce osztálya' }
        tags: { type: array, items: { type: string } }
        variables: { type: object, additionalProperties: true, description: 'a `v:*` változók — az integrációk ebből azonosítják a saját rekordjaikat' }
        occurred_at: { type: string, format: date-time }

    ValidationVerdict:
      type: object
      properties:
        address: { type: string }
        result:
          type: string
          enum: [deliverable, risky, undeliverable, unknown]
          description: |
            `deliverable` — minden jel jó · `risky` — valószínűleg jó, de nem biztos
            (szerepcím, catch-all, eldobható domain) · `undeliverable` — biztosan rossz
            (szintaxis, nincs MX, a fogadó elutasította) · `unknown` — nem tudtuk eldönteni.
        risk: { type: number, minimum: 0, maximum: 1 }
        reasons:
          type: array
          items:
            type: string
            enum: [SYNTAX_INVALID, NO_MX_RECORD, ROLE_ADDRESS, DISPOSABLE_DOMAIN, CATCH_ALL_DOMAIN, MAILBOX_NOT_FOUND, PROBE_INCONCLUSIVE, POSSIBLE_TYPO]
        did_you_mean:
          type: [string, 'null']
          description: 'elgépelés-javaslat (`gmial.com` → `gmail.com`)'
        checks:
          type: object
          description: |
            Ellenőrzésenkénti részeredmény. MINDEN kulcs jelen van, a korai kilépésnél is —
            az integrátor nem indexelhet vakon egy hiányzó kulcsra. A bool mezők MINDENHOL
            azt jelentik: „rendben van-e".
          additionalProperties: true

    ValidationJob:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: [string, 'null'] }
        status: { type: string, enum: [pending, processing, completed, failed] }
        total: { type: integer }
        processed: { type: integer }
        summary:
          type: object
          properties:
            deliverable: { type: integer }
            risky: { type: integer }
            undeliverable: { type: integer }
            unknown: { type: integer }
        started_at: { type: [string, 'null'], format: date-time }
        finished_at: { type: [string, 'null'], format: date-time }
        expires_at: { type: [string, 'null'], format: date-time }

    InboundRouteInput:
      type: object
      required: [match_type, actions]
      properties:
        description: { type: string, maxLength: 255 }
        priority: { type: integer, minimum: 0, maximum: 100000, default: 100 }
        match_type: { type: string, enum: [match_recipient, match_header, catch_all] }
        match_field: { type: [string, 'null'], description: '`match_header` esetén a fejléc neve' }
        expression:
          type: [string, 'null']
          maxLength: 512
          description: |
            Reguláris kifejezés határolók nélkül (`^support@pelda\.hu$`). Időkorláttal és
            visszalépés-korláttal fut: a katasztrofális visszalépésű minta nem viszi el a
            feldolgozást, csak nem illeszkedik.
        actions:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: object
            required: [type]
            properties:
              type: { type: string, enum: [forward, store, stop] }
              target: { type: [string, 'null'], description: 'URL (csak https) vagy e-mail-cím' }
        active: { type: boolean, default: true }

    InboundRoute:
      allOf:
        - { $ref: '#/components/schemas/InboundRouteInput' }
        - type: object
          properties:
            id: { type: string, format: uuid }
            last_matched_at: { type: [string, 'null'], format: date-time }

    InboundMessageSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        sender: { type: [string, 'null'], description: 'null = null-sender (bounce)' }
        recipient: { type: string }
        subject: { type: [string, 'null'] }
        status: { type: string, enum: [received, parsed, routed, failed, forward_failed] }
        size: { type: integer }
        received_at: { type: [string, 'null'], format: date-time }
        expires_at: { type: [string, 'null'], format: date-time }

    InboundMessage:
      type: object
      description: Ugyanaz az alak, amit a `forward(url)` POSTol.
      properties:
        id: { type: string, format: uuid }
        timestamp: { type: [integer, 'null'] }
        sender: { type: [string, 'null'] }
        recipient: { type: string }
        subject: { type: [string, 'null'] }
        message-id: { type: [string, 'null'] }
        body-plain: { type: [string, 'null'] }
        body-html: { type: [string, 'null'] }
        stripped-text:
          type: [string, 'null']
          description: 'a törzs az idézett előzmény és az aláírás NÉLKÜL — a válasz-kezeléshez'
        headers: { type: object, additionalProperties: { type: string } }
        authentication:
          type: object
          properties:
            spf: { type: [string, 'null'] }
            dkim: { type: [string, 'null'] }
            dmarc: { type: [string, 'null'] }
            spam_score: { type: [number, 'null'] }
        attachments:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              content_type: { type: string }
              size: { type: integer }
              sha256: { type: string }
              scan: { type: string, enum: [pending, clean, infected, unavailable, rejected] }
              url:
                type: [string, 'null']
                description: 'lejáró letöltési URL — CSAK a tisztának bizonyult csatolmányra'

    EventType:
      type: string
      description: |
        Az esemény típusa. A lista csak BŐVÜLHET — a fogadó az ismeretlen típust hagyja figyelmen kívül.

        - `bounced`: a fogadó szerver véglegesen elutasította (5xx vagy aszinkron DSN). A
          `delivery.bounce_type` mondja meg, hard vagy soft.
        - `failed`: a ventMail VÉGLEG feladta a kézbesítést anélkül, hogy végleges bounce
          érkezett volna (az újrapróbálások kimerültek: ideiglenes 4xx-ek, időtúllépés, MTA-hiba).
          A levél nem érkezett meg, és nem is fog. Előtte ugyanarra a címzettre egy `deferred` is
          érkezhet (külön `id`-vel).
        - `deferred`: átmeneti hiba, a ventMail még próbálkozik (nem végállapot).
        - `complained`: a címzett spamnek jelölte (FBL). A típus a szerződés része; a panasz-
          visszacsatolás feldolgozása még nem él, ezért jelenleg NEM keletkezik ilyen esemény.
      enum: [accepted, rejected, delivered, deferred, bounced, complained, unsubscribed, opened, clicked, stored, failed]

    WebhookEndpoint:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        url: { type: string }
        events:
          type: array
          description: Üres lista = MINDEN esemény.
          items: { $ref: '#/components/schemas/EventType' }
        active: { type: boolean }
        redact_recipient:
          type: boolean
          description: '`true`: a payload `message.recipient` mezője `null`, csak a `message.recipient_masked` megy ki. Alapérték `false`.'
        last_success_at: { type: [string, 'null'], format: date-time }
        last_failure_at: { type: [string, 'null'], format: date-time }

    WebhookDelivery:
      type: object
      properties:
        id: { type: string }
        event: { type: string }
        message_id: { type: [string, 'null'] }
        status: { type: string, enum: [pending, delivered, failed, dead_letter] }
        attempt: { type: integer }
        response_code: { type: [integer, 'null'] }
        response_excerpt: { type: [string, 'null'], description: 'a válasz eleje (max 500 karakter)' }
        next_attempt_at: { type: [string, 'null'], format: date-time }
        dead_lettered_at: { type: [string, 'null'], format: date-time }

    WebhookPayload:
      type: object
      description: |
        A kimenő webhook törzse (`POST` a végpont URL-jére, `Content-Type: application/json`).
        A mezők csak BŐVÜLHETNEK; az ismeretlen mezőt a fogadó hagyja figyelmen kívül. Levéltörzs,
        tárgy és a fogadó SMTP-válaszszövege SOHA nincs benne.
      required: [id, event, timestamp, message, delivery]
      properties:
        id:
          type: string
          format: uuid
          description: |
            Az ESEMÉNY stabil azonosítója (ugyanaz, mint a `GET /v1/events` `id`-je). Végpontonként,
            újrapróbálásnál és replay-nél is ugyanaz — a fogadó erre dedupoljon. A
            `X-VentMail-Event-Id` fejléc ugyanezt hordozza.
        event: { $ref: '#/components/schemas/EventType' }
        timestamp: { type: [integer, 'null'], description: 'az esemény ideje, unix másodperc (NEM az aláírás időbélyege)' }
        test: { type: boolean, description: 'csak a felületről küldött teszt-eseményen van jelen (`true`)' }
        message:
          type: object
          properties:
            id: { type: [string, 'null'], description: 'a `POST /v1/messages` (és `/v1/messages.mime`) válaszának `id`-je' }
            recipient: { type: [string, 'null'], description: 'a címzett — `null`, ha a végpont `redact_recipient: true` (visszamenőleg is: a kapcsoló előtt rögzített, még ki nem ment kézbesítésen is), vagy ha a címzett törlési kérést kért. A redakció CSAK erre a mezőre vonatkozik: a `variables` a hívó saját `v:*` értékeit változatlanul visszhangozza.' }
            recipient_masked: { type: [string, 'null'], description: 'a címzett maszkolva: az első karakter + `***` + `@domain` (pl. `a***@example.com`)' }
            channel: { type: string, enum: [transactional, marketing, journey, campaign] }
            tags: { type: [array, 'null'], items: { type: string } }
        reason:
          type: [string, 'null']
          description: |
            `bounced` esetén a bounce-osztály (`hard`, `soft`, `mailbox_full`, `blocked`, `spam`, `policy`).
            `failed` esetén a bounce-osztály, ha volt SMTP-válasz (a Postal 4xx-szel adta fel), `DRIVER_ERROR`
            / `DRIVER_REJECTED`, ha a ventMail saját újrapróbálásai merültek ki, vagy `null` (az MTA kód nélkül
            adta fel, pl. időtúllépés). Más eseményen strukturált ok vagy `null`. Ismeretlen értéket a fogadó
            kezeljen általános okként.
        variables:
          description: 'a hívó `v:*` változói visszhangozva. Üresen `[]` (JSON-tömb), egyébként objektum.'
          oneOf:
            - { type: object, additionalProperties: true }
            - { type: array, maxItems: 0 }
        delivery:
          type: object
          properties:
            code: { type: [integer, 'null'], description: 'a fogadó SMTP-kódja (pl. 550, 451)' }
            enhanced_code: { type: [string, 'null'], description: 'RFC 3463 kód (pl. `5.1.1`)' }
            classification: { type: [string, 'null'], enum: [hard, soft, mailbox_full, blocked, spam, policy, null] }
            bounce_type:
              type: [string, 'null']
              enum: [hard, soft, null]
              description: |
                Csak `bounced` eseményen. `hard`: a cím nem létezik / végleg érvénytelen — a ventMail
                azonnal suppression-listára tette, további küldés rá elutasítódik. `soft`: végleges
                elutasítás, de nem a cím hibája (tele postafiók, blokk, spam, policy); a cím csak
                ismétlődő `soft` / `mailbox_full` bounce után (5) kerül suppression-listára; a `blocked`,
                `spam`, `policy` a küldő oldali okot jelzi, a címet nem tiltja.

    ErrorCode:
      type: string
      description: |
        Stabil hibakódok. A gate strukturált okai VÁLTOZATLANUL jelennek meg itt — így a
        hívó ugyanazt látja, mint az üzenet-trace.
      enum:
        - UNAUTHENTICATED
        - TOO_MANY_REQUESTS
        - INSUFFICIENT_SCOPE
        - IDEMPOTENCY_KEY_REQUIRED
        - IDEMPOTENCY_KEY_TOO_LONG
        - IDEMPOTENCY_KEY_REUSED
        - INVALID_CHANNEL
        - CHANNEL_NOT_ALLOWED
        - UNSUPPORTED_ATTACHMENT
        # Kimenő csatolmány (`attachments`, H123).
        - INVALID_ATTACHMENT
        - UNSUPPORTED_ATTACHMENT_TYPE
        - ATTACHMENT_TYPE_MISMATCH
        - ATTACHMENT_TOO_LARGE
        - TOO_MANY_ATTACHMENTS
        - MIME_TOO_LARGE
        - MIME_MALFORMED
        - MIME_DUPLICATE_HEADER
        - MIME_BCC_NOT_SUPPORTED
        - VALIDATION_ERROR
        - MISSING_FROM
        - MISSING_RECIPIENT
        - TOO_MANY_RECIPIENTS
        - TOO_MANY_TAGS
        - INVALID_DELIVERYTIME
        - DELIVERYTIME_IN_PAST
        - DELIVERYTIME_TOO_FAR
        - INVALID_RECIPIENT_VARIABLES
        - UNKNOWN_IP_POOL
        - UNKNOWN_TEMPLATE
        - TEMPLATE_EXISTS
        - MISSING_MIME
        - MIME_MISSING_FROM
        - MIME_HEADERS_TOO_LARGE
        - DOMAIN_UNVERIFIED
        - SUPPRESSED
        - NO_CONSENT
        - QUOTA_EXCEEDED
        - RATE_LIMITED
        - VALIDATION_RISK
        - INVALID_REQUEST
        - GATE_ERROR
        # Éles küldési mód: seed-allowlist, illetve kikapcsolt marketing-csatorna.
        - SENDING_RESTRICTED
        - INVALID_TEMPLATE_VARIABLES
        - CHANNEL_DISABLED
        - ENTITLEMENT_REQUIRED
        - IP_POOL_CHANNEL_MISMATCH
        - UNSUPPORTED_MIME_OPTION
        # A nyers MIME-ban a leiratkozó fejléc nem engedett: a ventMail kezeli (RFC 8058),
        # és egy közös bájtsorban nem tudjuk címzettenként átírni.
        - UNSUPPORTED_MIME_HEADER
        # Consent-köteles csatornán a nyers MIME EGY címzettre küldhető: a one-click token a
        # címzett SZEMÉLYÉT hordozza, egy közös bájtsorba viszont csak egy token fér.
        - MIME_BULK_MARKETING
        - TEMPLATE_VERSION_CONFLICT
        - INVALID_MIME_UPLOAD
        - UNKNOWN_DELIVERY
        - ALREADY_DELIVERED
        - UNKNOWN_ENDPOINT
        - UNKNOWN_ROUTE
        - INVALID_ROUTE
        - UNKNOWN_MESSAGE
        - UNKNOWN_ATTACHMENT
        - RAW_UNAVAILABLE
        - ATTACHMENT_NOT_DOWNLOADABLE
        - RAW_CONTAINS_INFECTED_ATTACHMENT
        - UNKNOWN_JOB
        - EMPTY_LIST
        - LIST_TOO_LARGE
        - INVALID_WEBHOOK_URL
        - UNRESOLVABLE_WEBHOOK_URL
        - IN_PROGRESS
        # v1.1 · 7. modul: tiltólista.
        - SUPPRESSION_IRREVOCABLE
        - UNKNOWN_SUPPRESSION
